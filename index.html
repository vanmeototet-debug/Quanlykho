<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>iStock iOS - Quản lý Kho</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ios: {
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              orange: '#FF9500',
              pink: '#FF2D55',
              gray: '#8E8E93',
              bg: '#F2F2F7',
              card: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input, select, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
  </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 flex flex-col bg-ios-bg">

  <!-- Header -->
  <header class="bg-white/85 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 pt-safe shadow-xs">
    <div class="px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight" id="page-title">Tổng quan</h1>
        <p class="text-[11px] text-slate-400">iStock iOS - Quản lý Kho & Bán Hàng</p>
      </div>
      <div class="flex items-center gap-1">
        <!-- Nút Cài đặt Google Sheet URL -->
        <button onclick="toggleSheetModal(true)" class="p-2 text-ios-green hover:bg-slate-100 rounded-full transition-colors relative" title="Kết nối Google Sheets">
          <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
          <span id="sheet-dot" class="absolute top-1.5 right-1.5 w-2 h-2 bg-slate-300 rounded-full"></span>
        </button>
        <!-- Nút Xuất dự phòng -->
        <button onclick="exportData()" class="p-2 text-slate-400 hover:bg-slate-100 rounded-full transition-colors" title="Xuất file JSON dự phòng">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Modal Cài đặt Google Sheets -->
  <div id="sheet-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
          <i data-lucide="file-spreadsheet" class="w-5 h-5 text-ios-green"></i> Google Sheets Online
        </h3>
        <button onclick="toggleSheetModal(false)" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <p class="text-xs text-slate-500">
        Dán đường link <b>Apps Script Web App URL</b> từ Google Sheet chính của bạn vào đây để đồng bộ tự động 2 chiều.
      </p>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Google Web App URL</label>
        <input type="text" id="sheet-url-input" placeholder="https://script.google.com/macros/s/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-ios-green font-mono">
      </div>
      <div class="pt-2 space-y-2">
        <button onclick="saveSheetUrl()" class="w-full bg-ios-green text-white font-medium py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm active:opacity-90">
          <i data-lucide="check" class="w-4 h-4"></i> Lưu & Đồng bộ ngay
        </button>
        <button onclick="toggleSheetModal(false)" class="w-full bg-slate-100 text-slate-700 font-medium py-2.5 rounded-xl text-xs">
          Đóng
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto p-4 pb-28" id="app-content">
    <!-- Nội dung sẽ được hiển thị ở đây -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-30 pb-safe shadow-lg">
    <div class="flex justify-around items-center h-16 px-1">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex-1 flex flex-col items-center justify-center py-1 text-ios-blue">
        <i data-lucide="pie-chart" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">Tổng quan</span>
      </button>
      <button onclick="switchTab('inventory')" id="nav-inventory" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="boxes" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">Kho hàng</span>
      </button>
      <button onclick="switchTab('sales')" id="nav-sales" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">Bán hàng</span>
      </button>
      <button onclick="switchTab('reports')" id="nav-reports" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">Báo cáo & Tháng</span>
      </button>
    </div>
  </nav>

  <!-- JS Logic -->
  <script>
    let db = {
      products: [], 
      sales: [],
      imports: []
    };

    let googleSheetUrl = '';
    let selectedReportMonth = 'ALL';

    function getProductsList() {
      return db.products && db.products.length > 0 ? db.products : (db.items || []);
    }

    function loadDB() {
      const stored = localStorage.getItem('app_quanlykho_db');
      if (stored) {
        try {
          db = JSON.parse(stored);
          if (!db.products && db.items) db.products = db.items;
          if (!db.products) db.products = [];
          if (!db.sales) db.sales = [];
          if (!db.imports) db.imports = [];
        } catch(e) {
          console.error("Lỗi đọc dữ liệu local", e);
        }
      }
      googleSheetUrl = localStorage.getItem('app_quanlykho_sheet_url') || '';
      if (googleSheetUrl) {
        const urlInput = document.getElementById('sheet-url-input');
        if(urlInput) urlInput.value = googleSheetUrl;
        const sheetDot = document.getElementById('sheet-dot');
        if(sheetDot) sheetDot.className = 'absolute top-1.5 right-1.5 w-2 h-2 bg-emerald-500 rounded-full';
        fetchFromGoogleSheet();
      } else {
        switchTab(currentTab);
      }
    }

    function saveDB() {
      localStorage.setItem('app_quanlykho_db', JSON.stringify(db));
      syncToGoogleSheet();
    }

    function syncToGoogleSheet() {
      if (!googleSheetUrl) return;
      let form = document.getElementById('hidden-sync-form');
      if (!form) {
        form = document.createElement('form');
        form.id = 'hidden-sync-form';
        form.method = 'POST';
        form.action = googleSheetUrl;
        form.target = 'hidden-iframe';
        form.style.display = 'none';
        
        let input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.id = 'hidden-sync-payload';
        form.appendChild(input);
        
        let iframe = document.createElement('iframe');
        iframe.name = 'hidden-iframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        document.body.appendChild(form);
      }
      document.getElementById('hidden-sync-payload').value = JSON.stringify(db);
      form.submit();
    }

    function fetchFromGoogleSheet() {
      if (!googleSheetUrl) return;
      const scriptId = 'jsonp-script';
      let oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      window.handleSheetData = function(data) {
        if (data && (data.products || data.items)) {
          db = data;
          if (!db.products && db.items) db.products = db.items;
          if (!db.products) db.products = [];
          if (!db.sales) db.sales = [];
          if (!db.imports) db.imports = [];
          localStorage.setItem('app_quanlykho_db', JSON.stringify(db));
          switchTab(currentTab);
        }
      };

      const script = document.createElement('script');
      script.id = scriptId;
      script.src = googleSheetUrl + (googleSheetUrl.includes('?') ? '&' : '?') + 'callback=handleSheetData&t=' + Date.now();
      document.body.appendChild(script);
    }

    function saveSheetUrl() {
      const url = document.getElementById('sheet-url-input').value.trim();
      if (!url) {
        alert("Vui lòng nhập đường link Web App URL!");
        return;
      }
      googleSheetUrl = url;
      localStorage.setItem('app_quanlykho_sheet_url', googleSheetUrl);
      const sheetDot = document.getElementById('sheet-dot');
      if(sheetDot) sheetDot.className = 'absolute top-1.5 right-1.5 w-2 h-2 bg-emerald-500 rounded-full';
      fetchFromGoogleSheet();
      alert("Đã kết nối thành công với Google Sheets!");
      toggleSheetModal(false);
    }

    function formatMoney(num) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num || 0);
    }

    function formatNum(num) {
      return new Intl.NumberFormat('vi-VN').format(num || 0);
    }

    function getTodayString() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function toggleSheetModal(show) {
      const modal = document.getElementById('sheet-modal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
      lucide.createIcons();
    }

    let currentTab = 'dashboard';

    function switchTab(tab) {
      currentTab = tab;
      
      ['dashboard', 'inventory', 'sales', 'reports'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if(btn) {
          if (t === tab) {
            btn.className = 'flex-1 flex flex-col items-center justify-center py-1 text-ios-blue';
          } else {
            btn.className = 'flex-1 flex flex-col items-center justify-center py-1 text-slate-400';
          }
        }
      });

      const titleEl = document.getElementById('page-title');
      if (titleEl) {
        if (tab === 'dashboard') {
          titleEl.innerText = 'Tổng quan';
          renderDashboard();
        } else if (tab === 'inventory') {
          titleEl.innerText = 'Kho hàng';
          renderInventory();
        } else if (tab === 'sales') {
          titleEl.innerText = 'Bán hàng';
          renderSales();
        } else if (tab === 'reports') {
          titleEl.innerText = 'Báo cáo & Tháng';
          renderReports();
        }
      }

      lucide.createIcons();
    }

    // ==========================================
    // 1. DASHBOARD TAB
    // ==========================================
    function renderDashboard() {
      const container = document.getElementById('app-content');
      if(!container) return;

      const products = getProductsList();
      let totalStockVal = 0;
      products.forEach(p => {
        const cost = p.avgImportCost || p.unitCost || 0;
        totalStockVal += (p.currentStock || 0) * cost;
      });

      let totalRevToday = 0;
      let totalProfitToday = 0;
      let totalCostToday = 0;
      const todayStr = getTodayString();

      db.sales.forEach(s => {
        if (s.date === todayStr) {
          totalRevToday += (s.totalRevenue !== undefined ? s.totalRevenue : s.revenue || 0);
          totalProfitToday += (s.profit || 0);
          totalCostToday += (s.totalCost || 0);
        }
      });

      let html = `
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <p class="text-[11px] text-slate-400 font-medium">Doanh thu hôm nay</p>
            <p class="text-base font-extrabold text-slate-900 mt-1">${formatMoney(totalRevToday)}</p>
          </div>
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <p class="text-[11px] text-slate-400 font-medium">Vốn bán hôm nay</p>
            <p class="text-base font-extrabold text-amber-600 mt-1">${formatMoney(totalCostToday)}</p>
          </div>
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <p class="text-[11px] text-slate-400 font-medium">Lợi nhuận hôm nay</p>
            <p class="text-base font-extrabold text-ios-green mt-1">${formatMoney(totalProfitToday)}</p>
          </div>
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <p class="text-[11px] text-slate-400 font-medium">Giá trị tồn kho</p>
            <p class="text-base font-extrabold text-ios-blue mt-1">${formatMoney(totalStockVal)}</p>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
          <h2 class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i data-lucide="zap" class="w-4 h-4 text-ios-orange"></i> Trạng thái kho hàng
          </h2>
          <div class="text-xs text-slate-500 space-y-1">
            <p>Tổng số mặt hàng trong kho: <b class="text-slate-800">${products.length}</b></p>
            <p>Tổng số đơn bán hôm nay: <b class="text-slate-800">${db.sales.filter(s => s.date === todayStr).length} đơn</b></p>
          </div>
        </div>
      `;
      container.innerHTML = html;
    }

    // ==========================================
    // 2. INVENTORY TAB (KHO HÀNG)
    // ==========================================
    function renderInventory() {
      const container = document.getElementById('app-content');
      if(!container) return;

      const products = getProductsList();

      let html = `
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 border border-slate-100">
          <h2 class="text-sm font-bold mb-3 flex items-center text-slate-800">
            <i data-lucide="plus-circle" class="w-4 h-4 mr-2 text-ios-blue"></i> Nhập / Thêm mặt hàng mới
          </h2>
          <form onsubmit="handleAddProduct(event)" class="space-y-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Tên mặt hàng</label>
              <input type="text" id="p-name" required placeholder="VD: Gạo, Cam sành, Nước giặt..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Đơn vị tính</label>
                <input type="text" id="p-unit" required placeholder="Kg, Thùng, Cái..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Số lượng nhập</label>
                <input type="number" step="any" id="p-qty" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-500 mb-1">Tổng tiền vốn nhập (VND)</label>
              <input type="number" id="p-cost" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>

            <button type="submit" class="w-full bg-ios-blue text-white font-medium py-2.5 rounded-xl text-xs shadow-sm active:opacity-90">
              Lưu Vào Kho
            </button>
          </form>
        </div>

        <div class="space-y-3">
          <h2 class="text-xs font-semibold text-slate-500 px-1">Danh sách sản phẩm trong kho (${products.length})</h2>
      `;

      if (products.length === 0) {
        html += `
          <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <i data-lucide="package-search" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p class="text-xs">Chưa có sản phẩm nào trong kho</p>
          </div>
        `;
      } else {
        products.forEach(p => {
          const importQ = p.importQty || p.initialQty || 0;
          const totalC = p.totalImportCost || ((p.avgImportCost || 0) * importQ);
          const avgC = p.avgImportCost || p.unitCost || 0;
          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-start">
              <div class="space-y-1">
                <span class="font-bold text-slate-900 text-sm">${p.name}</span>
                <div class="text-xs text-slate-500 space-y-0.5">
                  <p>Nhập: <b class="text-slate-700">${formatNum(importQ)} ${p.unit}</b> (Vốn: ${formatMoney(totalC)})</p>
                  <p>Giá vốn TB: <b class="text-slate-700">${formatMoney(avgC)} / ${p.unit}</b></p>
                </div>
              </div>
              <div class="text-right flex flex-col justify-between items-end h-full">
                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${p.currentStock > 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'}">
                  Tồn: ${formatNum(p.currentStock)} ${p.unit}
                </span>
                <button onclick="deleteProduct('${p.id}')" class="mt-4 text-slate-300 hover:text-ios-red p-1" title="Xóa">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const name = document.getElementById('p-name').value.trim();
      const unit = document.getElementById('p-unit').value.trim();
      const importQty = parseFloat(document.getElementById('p-qty').value) || 0;
      const totalImportCost = parseFloat(document.getElementById('p-cost').value) || 0;

      if (importQty <= 0) {
        alert("Số lượng nhập phải lớn hơn 0!");
        return;
      }

      const avgImportCost = totalImportCost / importQty;
      let products = getProductsList();
      let existing = products.find(p => p.name.toLowerCase() === name.toLowerCase());

      if (existing) {
        const newImportQty = (existing.importQty || existing.initialQty || 0) + importQty;
        const newTotalCost = (existing.totalImportCost || 0) + totalImportCost;
        existing.importQty = newImportQty;
        existing.initialQty = newImportQty;
        existing.totalImportCost = newTotalCost;
        existing.avgImportCost = newTotalCost / newImportQty;
        existing.unitCost = existing.avgImportCost;
        existing.currentStock = (existing.currentStock || 0) + importQty;
        existing.unit = unit;
      } else {
        products.push({
          id: 'P_' + Date.now(),
          name,
          unit,
          importQty,
          initialQty: importQty,
          totalImportCost,
          avgImportCost,
          unitCost: avgImportCost,
          currentStock: importQty
        });
      }
      db.products = products;

      saveDB();
      renderInventory();
      lucide.createIcons();
    }

    function deleteProduct(id) {
      if (confirm("Xóa sản phẩm này sẽ XÓA TOÀN BỘ lịch sử bán hàng liên quan. Bạn chắc chắn chứ?")) {
        let products = getProductsList().filter(p => p.id !== id);
        db.products = products;
        db.sales = db.sales.filter(s => (s.productId || s.itemId) !== id);
        saveDB();
        renderInventory();
        lucide.createIcons();
      }
    }

    // ==========================================
    // 3. SALES TAB (BÁN HÀNG)
    // ==========================================
    function renderSales() {
      const container = document.getElementById('app-content');
      if(!container) return;

      const products = getProductsList();
      let productOptions = products.map(p => 
        `<option value="${p.id}">${p.name} - Tồn: ${formatNum(p.currentStock)} ${p.unit}</option>`
      ).join('');

      let html = `
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 border border-slate-100">
          <h2 class="text-sm font-bold mb-3 flex items-center text-slate-800">
            <i data-lucide="shopping-cart" class="w-4 h-4 mr-2 text-ios-green"></i> Ghi nhận đơn bán hàng
          </h2>
          <form onsubmit="handleAddSale(event)" class="space-y-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Chọn sản phẩm</label>
              <select id="s-prod-id" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue">
                <option value="">-- Chọn sản phẩm --</option>
                ${productOptions}
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Ngày bán</label>
                <input type="date" id="s-date" value="${getTodayString()}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Số lượng bán</label>
                <input type="number" step="any" id="s-qty" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-500 mb-1">Tổng tiền thực thu (VND)</label>
              <input type="number" id="s-rev" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>

            <button type="submit" class="w-full bg-ios-green text-white font-medium py-2.5 rounded-xl text-xs shadow-sm active:opacity-90">
              Xác Nhận Bán Hàng
            </button>
          </form>
        </div>

        <div class="space-y-3">
          <h2 class="text-xs font-semibold text-slate-500 px-1">Lịch sử bán hàng</h2>
      `;

      const validSales = db.sales.filter(s => products.some(p => p.id === (s.productId || s.itemId)));

      if (validSales.length === 0) {
        html += `
          <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <i data-lucide="receipt" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p class="text-xs">Chưa có giao dịch bán hàng nào</p>
          </div>
        `;
      } else {
        const sortedSales = [...validSales].reverse();
        sortedSales.forEach(s => {
          const pId = s.productId || s.itemId;
          const p = products.find(prod => prod.id === pId);
          if(!p) return;
          const rev = s.totalRevenue !== undefined ? s.totalRevenue : (s.revenue || 0);
          const prof = s.profit !== undefined ? s.profit : 0;
          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-900 text-sm">${p.name}</span>
                  <span class="text-[10px] text-slate-400">${s.date}</span>
                </div>
                <p class="text-xs text-slate-500 mt-1">
                  Đã bán: <b class="text-slate-700">${formatNum(s.qty)} ${p.unit}</b>
                </p>
              </div>
              <div class="text-right flex items-center gap-3">
                <div>
                  <p class="text-xs font-bold text-slate-900">${formatMoney(rev)}</p>
                  <p class="text-[10px] font-semibold ${prof >= 0 ? 'text-ios-green' : 'text-ios-red'}">
                    Lãi: ${formatMoney(prof)}
                  </p>
                </div>
                <button onclick="deleteSale('${s.id}')" class="text-slate-300 hover:text-ios-red p-1" title="Xóa">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function handleAddSale(e) {
      e.preventDefault();
      const productId = document.getElementById('s-prod-id').value;
      const date = document.getElementById('s-date').value;
      const qty = parseFloat(document.getElementById('s-qty').value) || 0;
      const totalRevenue = parseFloat(document.getElementById('s-rev').value) || 0;

      const products = getProductsList();
      const p = products.find(prod => prod.id === productId);
      if (!p) {
        alert("Vui lòng chọn sản phẩm!");
        return;
      }

      if (qty <= 0) {
        alert("Số lượng bán phải lớn hơn 0!");
        return;
      }

      if (qty > p.currentStock) {
        if (!confirm(`Số lượng bán (${qty}) vượt quá tồn kho hiện tại (${p.currentStock} ${p.unit}). Bạn muốn tiếp tục?`)) {
          return;
        }
      }

      const avgCost = p.avgImportCost || p.unitCost || 0;
      const totalCost = qty * avgCost;
      const profit = totalRevenue - totalCost;

      p.currentStock -= qty;

      db.sales.push({
        id: 'S_' + Date.now(),
        date,
        productId,
        qty,
        totalRevenue,
        actualUnitPrice: totalRevenue / qty,
        totalCost,
        profit
      });

      saveDB();
      renderSales();
      lucide.createIcons();
    }

    function deleteSale(saleId) {
      if (confirm("Xóa đơn bán hàng này? (Số lượng sẽ được cộng trả lại kho)")) {
        const sale = db.sales.find(s => s.id === saleId);
        if (sale) {
          const pId = sale.productId || sale.itemId;
          const products = getProductsList();
          const p = products.find(prod => prod.id === pId);
          if (p) {
            p.currentStock += sale.qty;
          }
          db.sales = db.sales.filter(s => s.id !== saleId);
          saveDB();
          renderSales();
          lucide.createIcons();
        }
      }
    }

    // ==========================================
    // 4. REPORTS TAB (BÁO CÁO & BIỂU ĐỒ THEO THÁNG)
    // ==========================================
    function changeReportMonth(monthVal) {
      selectedReportMonth = monthVal;
      renderReports();
      lucide.createIcons();
    }

    function renderReports() {
      const container = document.getElementById('app-content');
      if(!container) return;

      const products = getProductsList();
      const validSales = db.sales.filter(s => products.some(p => p.id === (s.productId || s.itemId)));

      // Gom nhóm theo tháng từ tất cả giao dịch (YYYY-MM)
      let monthlyMap = {};
      validSales.forEach(s => {
        if(!s.date) return;
        const mKey = s.date.substring(0, 7); // "2026-10"
        if(!monthlyMap[mKey]) monthlyMap[mKey] = { revenue: 0, profit: 0, cost: 0, salesCount: 0 };
        const rev = s.totalRevenue !== undefined ? s.totalRevenue : (s.revenue || 0);
        const prof = s.profit || 0;
        const cst = s.totalCost || 0;
        monthlyMap[mKey].revenue += rev;
        monthlyMap[mKey].profit += prof;
        monthlyMap[mKey].cost += cst;
        monthlyMap[mKey].salesCount++;
      });

      const sortedMonths = Object.keys(monthlyMap).sort().reverse();

      // Lọc giao dịch theo tháng được chọn
      let filteredSales = validSales;
      if (selectedReportMonth !== 'ALL') {
        filteredSales = validSales.filter(s => s.date && s.date.startsWith(selectedReportMonth));
      }

      let totalRevenue = 0;
      let totalProfit = 0;
      let totalCostVal = 0;
      filteredSales.forEach(s => {
        totalRevenue += (s.totalRevenue !== undefined ? s.totalRevenue : (s.revenue || 0));
        totalProfit += (s.profit || 0);
        totalCostVal += (s.totalCost || 0);
      });

      let monthOptions = `<option value="ALL">🗓️ Tất cả các tháng (Tổng hợp)</option>`;
      sortedMonths.forEach(m => {
        const parts = m.split('-');
        const label = `Tháng ${parts[1]} / ${parts[0]}`;
        monthOptions += `<option value="${m}" ${selectedReportMonth === m ? 'selected' : ''}>${label}</option>`;
      });

      let html = `
        <!-- Bộ lọc Tháng -->
        <div class="bg-white rounded-2xl p-3 shadow-sm mb-4 border border-slate-100 flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-600">Chọn thời gian:</span>
          <select id="report-month-select" onchange="changeReportMonth(this.value)" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-ios-blue text-slate-800">
            ${monthOptions}
          </select>
        </div>

        <!-- BIỂU ĐỒ TỔNG QUAN CÁC THÁNG -->
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 border border-slate-100 space-y-3">
          <h2 class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i data-lucide="bar-chart-2" class="w-4 h-4 text-ios-blue"></i> Biểu đồ Vốn & Lãi các tháng
          </h2>
      `;

      if (sortedMonths.length === 0) {
        html += `<p class="text-center text-xs text-slate-400 py-3">Chưa có dữ liệu bán hàng để hiển thị biểu đồ</p>`;
      } else {
        let maxRev = 1;
        sortedMonths.forEach(m => {
          if (monthlyMap[m].revenue > maxRev) maxRev = monthlyMap[m].revenue;
        });

        html += `<div class="space-y-2.5 pt-1">`;
        sortedMonths.forEach(m => {
          const data = monthlyMap[m];
          const parts = m.split('-');
          const mLabel = `Tháng ${parts[1]}/${parts[0]}`;
          const revPercent = Math.round((data.revenue / maxRev) * 100);

          html += `
            <div class="bg-slate-50 p-2.5 rounded-xl space-y-1.5">
              <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-slate-800">${mLabel}</span>
                <span class="text-[11px] font-semibold text-ios-green">Lãi: ${formatMoney(data.profit)}</span>
              </div>
              <div class="space-y-1">
                <div>
                  <div class="flex justify-between text-[10px] text-slate-500 mb-0.5">
                    <span>Doanh thu:</span>
                    <span class="font-bold text-slate-700">${formatMoney(data.revenue)}</span>
                  </div>
                  <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div class="bg-ios-blue h-full rounded-full transition-all duration-500" style="width: ${revPercent}%"></div>
                  </div>
                </div>
                <div>
                  <div class="flex justify-between text-[10px] text-slate-500 mb-0.5">
                    <span>Vốn hàng bán:</span>
                    <span class="font-bold text-slate-700">${formatMoney(data.cost)}</span>
                  </div>
                  <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-amber-500 h-full rounded-full transition-all duration-500" style="width: ${Math.round((data.cost / maxRev) * 100)}%"></div>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `</div>`;

      // Thẻ tổng hợp
      html += `
        <div class="grid grid-cols-1 gap-3 mb-6">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400 font-medium">Tổng Doanh Thu Bán Hàng</p>
              <p class="text-lg font-extrabold text-slate-900 mt-0.5">${formatMoney(totalRevenue)}</p>
            </div>
            <div class="w-10 h-10 bg-blue-50 text-ios-blue rounded-full flex items-center justify-center">
              <i data-lucide="trending-up" class="w-5 h-5"></i>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400 font-medium">Lợi Nhuận Thực Tế (Thu - Vốn Bán)</p>
              <p class="text-xl font-black ${totalProfit >= 0 ? 'text-ios-green' : 'text-ios-red'} mt-0.5">${formatMoney(totalProfit)}</p>
            </div>
            <div class="w-10 h-10 ${totalProfit >= 0 ? 'bg-emerald-50 text-ios-green' : 'bg-red-50 text-red-500'} rounded-full flex items-center justify-center">
              <i data-lucide="piggy-bank" class="w-5 h-5"></i>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <h2 class="text-xs font-semibold text-slate-500 px-1">Chi tiết theo sản phẩm (${selectedReportMonth === 'ALL' ? 'Tất cả các tháng' : selectedReportMonth})</h2>
      `;

      if (products.length === 0) {
        html += `
          <div class="text-center py-6 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <p class="text-xs">Chưa có sản phẩm nào để thống kê</p>
          </div>
        `;
      } else {
        products.forEach(p => {
          const itemSales = filteredSales.filter(s => (s.productId || s.itemId) === p.id);
          const soldQty = itemSales.reduce((sum, s) => sum + s.qty, 0);
          const itemRevenue = itemSales.reduce((sum, s) => sum + (s.totalRevenue !== undefined ? s.totalRevenue : (s.revenue || 0)), 0);
          const itemProfit = itemSales.reduce((sum, s) => sum + (s.profit || 0), 0);
          const importQ = p.importQty || p.initialQty || 0;

          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2">
              <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <span class="font-bold text-slate-900 text-sm">${p.name}</span>
                <span class="text-xs font-bold text-slate-700">
                  Doanh thu: ${formatMoney(itemRevenue)}
                </span>
              </div>
              <div class="grid grid-cols-2 gap-2 text-xs text-slate-500 bg-slate-50 p-2.5 rounded-xl">
                <div>
                  <p>Nhập ban đầu: <b class="text-slate-700">${formatNum(importQ)} ${p.unit}</b></p>
                  <p>Đã Bán: <b class="text-slate-700">${formatNum(soldQty)} ${p.unit}</b></p>
                </div>
                <div class="text-right space-y-0.5">
                  <p>Tồn Kho Hiện Tại:</p>
                  <p class="text-xs font-extrabold text-emerald-600">${formatNum(p.currentStock)} ${p.unit}</p>
                  <p>Lãi sản phẩm: <b class="text-ios-green">${formatMoney(itemProfit)}</b></p>
                </div>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `iStock_quanlykho_backup_${getTodayString()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.onload = function() {
      loadDB();
      switchTab('dashboard');
    };
  </script>
</body>
