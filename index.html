<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Quản lý Bán hàng & Tồn kho</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ios: {
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              orange: '#FF9500',
              gray: '#8E8E93',
              bg: '#F2F2F7',
              card: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input, select, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
  </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 flex flex-col bg-ios-bg">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 pt-safe">
    <div class="px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-900 tracking-tight" id="page-title">Sản phẩm & Tồn kho</h1>
      <button onclick="exportData()" class="p-2 text-ios-blue hover:bg-slate-100 rounded-full transition-colors" title="Xuất dữ liệu">
        <i data-lucide="download" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto p-4 pb-24" id="app-content">
    <!-- Dynamic Content injected by JS -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 z-30 pb-safe">
    <div class="flex justify-around items-center h-16 px-2">
      <button onclick="switchTab('products')" id="nav-products" class="flex-1 flex flex-col items-center justify-center py-1 text-ios-blue">
        <i data-lucide="package" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium mt-1">Sản phẩm</span>
      </button>
      <button onclick="switchTab('sales')" id="nav-sales" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="shopping-cart" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium mt-1">Bán hàng</span>
      </button>
      <button onclick="switchTab('reports')" id="nav-reports" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium mt-1">Báo cáo</span>
      </button>
    </div>
  </nav>

  <!-- JS Logic -->
  <script>
    // Data Storage Structure
    let db = {
      products: [], // { id, code, name, unit, totalImportCost, importQty, avgImportCost, minSuggestPrice, currentStock }
      sales: []     // { id, date, productId, qty, price, totalRevenue, totalCost, profit }
    };

    // Load Data from LocalStorage
    function loadDB() {
      const stored = localStorage.getItem('app_inventory_db');
      if (stored) {
        try {
          db = JSON.parse(stored);
        } catch(e) {
          console.error("Lỗi đọc dữ liệu local", e);
        }
      }
    }

    // Save Data to LocalStorage
    function saveDB() {
      localStorage.setItem('app_inventory_db', JSON.stringify(db));
    }

    // Format Currency (VND)
    function formatMoney(num) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num || 0);
    }

    // Format Number
    function formatNum(num) {
      return new Intl.NumberFormat('vi-VN').format(num || 0);
    }

    // Helper: Today YYYY-MM-DD
    function getTodayString() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // Active Tab Tracker
    let currentTab = 'products';

    function switchTab(tab) {
      currentTab = tab;
      
      // Update Navigation styling
      ['products', 'sales', 'reports'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tab) {
          btn.className = 'flex-1 flex flex-col items-center justify-center py-1 text-ios-blue';
        } else {
          btn.className = 'flex-1 flex flex-col items-center justify-center py-1 text-slate-400';
        }
      });

      // Update Title & Content
      const titleEl = document.getElementById('page-title');
      if (tab === 'products') {
        titleEl.innerText = 'Sản phẩm & Tồn kho';
        renderProducts();
      } else if (tab === 'sales') {
        titleEl.innerText = 'Nhật ký Bán hàng';
        renderSales();
      } else if (tab === 'reports') {
        titleEl.innerText = 'Báo cáo Lãi / Lỗ';
        renderReports();
      }

      lucide.createIcons();
    }

    // ==========================================
    // 1. PRODUCTS TAB (SẢN PHẨM & TỒN KHO)
    // ==========================================
    function renderProducts() {
      const container = document.getElementById('app-content');
      
      let html = `
        <!-- Form Thêm Sản Phẩm Mới -->
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 border border-slate-100">
          <h2 class="text-base font-semibold mb-3 flex items-center text-slate-800">
            <i data-lucide="plus-circle" class="w-5 h-5 mr-2 text-ios-blue"></i> Thêm sản phẩm mới
          </h2>
          <form onsubmit="handleAddProduct(event)" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Mã sản phẩm</label>
                <input type="text" id="p-code" required placeholder="VD: CAM01" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Tên sản phẩm</label>
                <input type="text" id="p-name" required placeholder="VD: Cam Sành" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Đơn vị tính</label>
                <input type="text" id="p-unit" required placeholder="kg, túi, hộp..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Số lượng nhập</label>
                <input type="number" step="any" id="p-qty" oninput="calcProductPrices()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-500 mb-1">Tổng giá nhập (VND)</label>
              <input type="number" id="p-total-cost" oninput="calcProductPrices()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>

            <!-- Tự động tính toán -->
            <div class="bg-blue-50/60 rounded-xl p-3 grid grid-cols-2 gap-2 border border-blue-100 text-xs">
              <div>
                <span class="text-slate-500 block">Giá nhập TB / ĐVT:</span>
                <span id="p-avg-cost-preview" class="font-bold text-slate-800">0 đ</span>
              </div>
              <div>
                <span class="text-slate-500 block">Gợi ý giá bán (>50% lãi):</span>
                <span id="p-min-price-preview" class="font-bold text-ios-green">0 đ</span>
              </div>
            </div>

            <button type="submit" class="w-full bg-ios-blue text-white font-medium py-2.5 rounded-xl text-sm shadow-sm active:opacity-90">
              Lưu Sản Phẩm
            </button>
          </form>
        </div>

        <!-- Danh sách sản phẩm -->
        <div class="space-y-3">
          <h2 class="text-sm font-semibold text-slate-500 px-1">Danh sách sản phẩm (${db.products.length})</h2>
      `;

      if (db.products.length === 0) {
        html += `
          <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <i data-lucide="package-x" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p class="text-sm">Chưa có sản phẩm nào</p>
          </div>
        `;
      } else {
        db.products.forEach(p => {
          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-start">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-900">${p.name}</span>
                  <span class="bg-slate-100 text-slate-600 text-[11px] px-2 py-0.5 rounded-md font-mono">${p.code}</span>
                </div>
                <div class="text-xs text-slate-500 space-y-0.5">
                  <p>SL Nhập ban đầu: <b class="text-slate-700">${formatNum(p.importQty)} ${p.unit}</b> (Tổng: ${formatMoney(p.totalImportCost)})</p>
                  <p>Giá nhập TB: <b class="text-slate-700">${formatMoney(p.avgImportCost)} / ${p.unit}</b></p>
                  <p>Gợi ý giá bán (>50%): <b class="text-ios-green">${formatMoney(p.minSuggestPrice)}</b></p>
                </div>
              </div>
              <div class="text-right flex flex-col justify-between items-end h-full">
                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${p.currentStock > 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'}">
                  Tồn: ${formatNum(p.currentStock)} ${p.unit}
                </span>
                <button onclick="deleteProduct('${p.id}')" class="mt-4 text-slate-300 hover:text-ios-red p-1">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    // Tự động tính Giá TB và Giá bán gợi ý (>50% lãi)
    function calcProductPrices() {
      const qty = parseFloat(document.getElementById('p-qty').value) || 0;
      const totalCost = parseFloat(document.getElementById('p-total-cost').value) || 0;

      let avgCost = 0;
      let minSuggest = 0;

      if (qty > 0 && totalCost > 0) {
        avgCost = totalCost / qty;
        minSuggest = avgCost * 1.5; // Lãi > 50%
      }

      document.getElementById('p-avg-cost-preview').innerText = formatMoney(avgCost);
      document.getElementById('p-min-price-preview').innerText = formatMoney(minSuggest);
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const code = document.getElementById('p-code').value.trim().toUpperCase();
      const name = document.getElementById('p-name').value.trim();
      const unit = document.getElementById('p-unit').value.trim();
      const importQty = parseFloat(document.getElementById('p-qty').value) || 0;
      const totalImportCost = parseFloat(document.getElementById('p-total-cost').value) || 0;

      if (importQty <= 0) {
        alert("Số lượng nhập phải lớn hơn 0!");
        return;
      }

      const avgImportCost = totalImportCost / importQty;
      const minSuggestPrice = avgImportCost * 1.5;

      const newProd = {
        id: 'P_' + Date.now(),
        code,
        name,
        unit,
        importQty,
        totalImportCost,
        avgImportCost,
        minSuggestPrice,
        currentStock: importQty
      };

      db.products.push(newProd);
      saveDB();
      renderProducts();
      lucide.createIcons();
    }

    function deleteProduct(id) {
      if (confirm("Bạn có chắc chắn muốn xóa sản phẩm này?")) {
        db.products = db.products.filter(p => p.id !== id);
        saveDB();
        renderProducts();
        lucide.createIcons();
      }
    }

    // ==========================================
    // 2. SALES TAB (BÁN HÀNG)
    // ==========================================
    function renderSales() {
      const container = document.getElementById('app-content');

      let productOptions = db.products.map(p => 
        `<option value="${p.id}">${p.name} (${p.code}) - Tồn: ${formatNum(p.currentStock)} ${p.unit}</option>`
      ).join('');

      let html = `
        <!-- Form Ghi Nhận Bán Hàng -->
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 border border-slate-100">
          <h2 class="text-base font-semibold mb-3 flex items-center text-slate-800">
            <i data-lucide="shopping-bag" class="w-5 h-5 mr-2 text-ios-green"></i> Đơn bán hàng mới
          </h2>
          <form onsubmit="handleAddSale(event)" class="space-y-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Chọn Sản Phẩm</label>
              <select id="s-product-id" onchange="onSelectSaleProduct()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
                <option value="">-- Chọn sản phẩm --</option>
                ${productOptions}
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Ngày bán</label>
                <input type="date" id="s-date" value="${getTodayString()}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Số lượng bán</label>
                <input type="number" step="any" id="s-qty" oninput="calcSalePreview()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-500 mb-1">Giá bán thực tế / ĐVT (VND)</label>
              <input type="number" id="s-price" oninput="calcSalePreview()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>

            <!-- Preview Doanh thu & Lãi tạm tính -->
            <div class="bg-emerald-50/60 rounded-xl p-3 grid grid-cols-2 gap-2 border border-emerald-100 text-xs">
              <div>
                <span class="text-slate-500 block">Tổng Doanh Thu:</span>
                <span id="s-revenue-preview" class="font-bold text-slate-800">0 đ</span>
              </div>
              <div>
                <span class="text-slate-500 block">Lợi Nhuận Dự Kiến:</span>
                <span id="s-profit-preview" class="font-bold text-ios-green">0 đ</span>
              </div>
            </div>

            <button type="submit" class="w-full bg-ios-green text-white font-medium py-2.5 rounded-xl text-sm shadow-sm active:opacity-90">
              Xác Nhận Bán Hàng
            </button>
          </form>
        </div>

        <!-- Lịch sử bán hàng -->
        <div class="space-y-3">
          <h2 class="text-sm font-semibold text-slate-500 px-1">Lịch sử giao dịch bán</h2>
      `;

      if (db.sales.length === 0) {
        html += `
          <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <i data-lucide="receipt" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p class="text-sm">Chưa có giao dịch bán nào</p>
          </div>
        `;
      } else {
        // Sắp xếp ngày mới nhất lên đầu
        const sortedSales = [...db.sales].reverse();
        sortedSales.forEach(s => {
          const prod = db.products.find(p => p.id === s.productId) || { name: 'Đã xóa', unit: '' };
          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-900">${prod.name}</span>
                  <span class="text-xs text-slate-400">${s.date}</span>
                </div>
                <p class="text-xs text-slate-500 mt-1">
                  Đã bán: <b class="text-slate-700">${formatNum(s.qty)} ${prod.unit}</b> x ${formatMoney(s.price)}
                </p>
              </div>
              <div class="text-right">
                <p class="text-sm font-bold text-slate-900">${formatMoney(s.totalRevenue)}</p>
                <p class="text-xs font-semibold ${s.profit >= 0 ? 'text-ios-green' : 'text-ios-red'}">
                  Lãi: ${formatMoney(s.profit)}
                </p>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    // Tự động điền giá gợi ý khi chọn sản phẩm
    function onSelectSaleProduct() {
      const pId = document.getElementById('s-product-id').value;
      const prod = db.products.find(p => p.id === pId);
      if (prod) {
        document.getElementById('s-price').value = Math.round(prod.minSuggestPrice);
        calcSalePreview();
      }
    }

    // Tính toán preview doanh thu & lãi
    function calcSalePreview() {
      const pId = document.getElementById('s-product-id').value;
      const qty = parseFloat(document.getElementById('s-qty').value) || 0;
      const price = parseFloat(document.getElementById('s-price').value) || 0;

      const prod = db.products.find(p => p.id === pId);
      let revenue = qty * price;
      let profit = 0;

      if (prod) {
        let cost = qty * prod.avgImportCost;
        profit = revenue - cost;
      }

      document.getElementById('s-revenue-preview').innerText = formatMoney(revenue);
      document.getElementById('s-profit-preview').innerText = formatMoney(profit);
    }

    function handleAddSale(e) {
      e.preventDefault();
      const productId = document.getElementById('s-product-id').value;
      const date = document.getElementById('s-date').value;
      const qty = parseFloat(document.getElementById('s-qty').value) || 0;
      const price = parseFloat(document.getElementById('s-price').value) || 0;

      const prod = db.products.find(p => p.id === productId);
      if (!prod) {
        alert("Vui lòng chọn sản phẩm!");
        return;
      }

      if (qty <= 0) {
        alert("Số lượng bán phải lớn hơn 0!");
        return;
      }

      if (qty > prod.currentStock) {
        if (!confirm(`Số lượng bán (${qty}) vượt quá tồn kho hiện tại (${prod.currentStock} ${prod.unit}). Bạn có muốn tiếp tục?`)) {
          return;
        }
      }

      const totalRevenue = qty * price;
      const totalCost = qty * prod.avgImportCost;
      const profit = totalRevenue - totalCost;

      // Trừ tồn kho
      prod.currentStock -= qty;

      // Thêm bản ghi bán hàng
      db.sales.push({
        id: 'S_' + Date.now(),
        date,
        productId,
        qty,
        price,
        totalRevenue,
        totalCost,
        profit
      });

      saveDB();
      renderSales();
      lucide.createIcons();
    }

    // ==========================================
    // 3. REPORTS TAB (BÁO CÁO LÃI LỖ)
    // ==========================================
    function renderReports() {
      const container = document.getElementById('app-content');

      let totalRevenue = 0;
      let totalCost = 0;
      let totalProfit = 0;

      db.sales.forEach(s => {
        totalRevenue += s.totalRevenue;
        totalCost += s.totalCost;
        totalProfit += s.profit;
      });

      let html = `
        <!-- Thống kê tổng quan -->
        <div class="grid grid-cols-1 gap-3 mb-6">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400 font-medium">Tổng Doanh Thu</p>
              <p class="text-xl font-extrabold text-slate-900 mt-0.5">${formatMoney(totalRevenue)}</p>
            </div>
            <div class="w-10 h-10 bg-blue-50 text-ios-blue rounded-full flex items-center justify-center">
              <i data-lucide="trending-up" class="w-5 h-5"></i>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400 font-medium">Tổng Giá Vốn Đã Bán</p>
              <p class="text-xl font-extrabold text-slate-700 mt-0.5">${formatMoney(totalCost)}</p>
            </div>
            <div class="w-10 h-10 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center">
              <i data-lucide="dollar-sign" class="w-5 h-5"></i>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400 font-medium">Lợi Nhuận Thu Được</p>
              <p class="text-2xl font-black ${totalProfit >= 0 ? 'text-ios-green' : 'text-ios-red'} mt-0.5">${formatMoney(totalProfit)}</p>
            </div>
            <div class="w-10 h-10 ${totalProfit >= 0 ? 'bg-emerald-50 text-ios-green' : 'bg-red-50 text-ios-red'} rounded-full flex items-center justify-center">
              <i data-lucide="piggy-bank" class="w-5 h-5"></i>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    // Export Data JSON
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `quanlykho_backup_${getTodayString()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // App Initialization
    window.onload = function() {
      loadDB();
      switchTab('products');
    };
  </script>
