<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Quản lý Bán hàng & Tồn kho</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ios: {
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              orange: '#FF9500',
              pink: '#FF2D55',
              gray: '#8E8E93',
              bg: '#F2F2F7',
              card: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input, select, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
  </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 flex flex-col bg-ios-bg">

  <!-- Header -->
  <header class="bg-white/85 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 pt-safe">
    <div class="px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-900 tracking-tight" id="page-title">Sản phẩm & Tồn kho</h1>
      <div class="flex items-center gap-1">
        <button onclick="toggleSheetModal(true)" class="p-2 text-ios-green hover:bg-slate-100 rounded-full transition-colors relative" title="Kết nối Google Sheets">
          <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
          <span id="sheet-dot" class="absolute top-1.5 right-1.5 w-2 h-2 bg-slate-300 rounded-full"></span>
        </button>
        <button onclick="exportData()" class="p-2 text-slate-400 hover:bg-slate-100 rounded-full transition-colors" title="Xuất file JSON dự phòng">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Modal Cài đặt Google Sheets -->
  <div id="sheet-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">
          <i data-lucide="file-spreadsheet" class="w-5 h-5 text-ios-green"></i> Google Sheets Online
        </h3>
        <button onclick="toggleSheetModal(false)" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <p class="text-xs text-slate-500">
        Dán đường link <b>Apps Script Web App URL</b> từ Google Sheet của bạn vào đây để đồng bộ tự động online.
      </p>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Google Web App URL</label>
        <input type="text" id="sheet-url-input" placeholder="https://script.google.com/macros/s/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-ios-green font-mono">
      </div>
      <div class="pt-2 space-y-2">
        <button onclick="saveSheetUrl()" class="w-full bg-ios-green text-white font-medium py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm active:opacity-90">
          <i data-lucide="check" class="w-4 h-4"></i> Lưu & Đồng bộ ngay
        </button>
        <button onclick="toggleSheetModal(false)" class="w-full bg-slate-100 text-slate-700 font-medium py-2.5 rounded-xl text-xs">
          Đóng
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto p-4 pb-24" id="app-content"></main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 z-30 pb-safe">
    <div class="flex justify-around items-center h-16 px-1">
      <button onclick="switchTab('products')" id="nav-products" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="package" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium mt-1">Sản phẩm</span>
      </button>
      <button onclick="switchTab('sales')" id="nav-sales" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium mt-1">Bán hàng</span>
      </button>
      <button onclick="switchTab('giveaways')" id="nav-giveaways" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="gift" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium mt-1">Biếu tặng</span>
      </button>
      <button onclick="switchTab('damaged')" id="nav-damaged" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium mt-1">Hư hỏng</span>
      </button>
      <button onclick="switchTab('reports')" id="nav-reports" class="flex-1 flex flex-col items-center justify-center py-1 text-ios-blue">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium mt-1">Báo cáo</span>
      </button>
    </div>
  </nav>

  <!-- JS Logic -->
  <script>
    let db = { products: [], imports: [], sales: [], giveaways: [], damaged: [] };
    let googleSheetUrl = '';
    let openDailySalesMap = {};
    let openDailyImportsMap = {};

    function loadDB() {
      const stored = localStorage.getItem('app_inventory_db');
      if (stored) {
        try {
          db = JSON.parse(stored);
          if (!db.imports) db.imports = [];
          if (!db.giveaways) db.giveaways = [];
          if (!db.damaged) db.damaged = [];
          
          if (db.products) {
            db.products.forEach(p => {
              let matchedImports = db.imports.filter(i => i.productId === p.id);
              if (matchedImports.length > 0) {
                p.batches = matchedImports.map(imp => ({
                  batchId: imp.id || ('B_' + Date.now()),
                  date: imp.date,
                  qty: imp.qty,
                  cost: imp.totalCost,
                  recoveredRevenue: 0
                }));
              } else if (!p.batches || p.batches.length === 0) {
                let costVal = p.totalImportCost || 0;
                let qtyVal = p.importQty || p.currentStock || 0;
                p.batches = [{
                  batchId: 'B_' + Date.now(),
                  date: getTodayString(),
                  qty: qtyVal > 0 ? qtyVal : (p.currentStock || 0),
                  cost: costVal,
                  recoveredRevenue: 0
                }];
              }
            });
          }
        } catch(e) { console.error(e); }
      }
      googleSheetUrl = localStorage.getItem('app_google_sheet_url') || '';
      if (googleSheetUrl) {
        document.getElementById('sheet-url-input').value = googleSheetUrl;
        document.getElementById('sheet-dot').className = 'absolute top-1.5 right-1.5 w-2 h-2 bg-emerald-500 rounded-full';
        fetchFromGoogleSheet();
      }
    }

    function saveDB() {
      localStorage.setItem('app_inventory_db', JSON.stringify(db));
      syncToGoogleSheet();
    }

    function syncToGoogleSheet() {
      if (!googleSheetUrl) return;
      let form = document.getElementById('hidden-sync-form');
      if (!form) {
        form = document.createElement('form');
        form.id = 'hidden-sync-form';
        form.method = 'POST';
        form.action = googleSheetUrl;
        form.target = 'hidden-iframe';
        form.style.display = 'none';
        let input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.id = 'hidden-sync-payload';
        form.appendChild(input);
        let iframe = document.createElement('iframe');
        iframe.name = 'hidden-iframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        document.body.appendChild(form);
      }
      document.getElementById('hidden-sync-payload').value = JSON.stringify(db);
      form.submit();
    }

    function fetchFromGoogleSheet() {
      if (!googleSheetUrl) return;
      const scriptId = 'jsonp-script';
      let oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();
      window.handleSheetData = function(data) {
        if (data && data.products) {
          db = data;
          if (!db.imports) db.imports = [];
          if (!db.giveaways) db.giveaways = [];
          if (!db.damaged) db.damaged = [];
          localStorage.setItem('app_inventory_db', JSON.stringify(db));
          switchTab(currentTab);
        }
      };
      const script = document.createElement('script');
      script.id = scriptId;
      script.src = googleSheetUrl + (googleSheetUrl.includes('?') ? '&' : '?') + 'callback=handleSheetData&t=' + Date.now();
      document.body.appendChild(script);
    }

    function saveSheetUrl() {
      const url = document.getElementById('sheet-url-input').value.trim();
      if (!url) { alert("Vui lòng nhập đường link Web App URL!"); return; }
      googleSheetUrl = url;
      localStorage.setItem('app_google_sheet_url', googleSheetUrl);
      document.getElementById('sheet-dot').className = 'absolute top-1.5 right-1.5 w-2 h-2 bg-emerald-500 rounded-full';
      fetchFromGoogleSheet();
      alert("Đã kết nối thành công với Google Sheets!");
      toggleSheetModal(false);
    }

    function formatMoney(num) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num || 0);
    }
    function formatNum(num) { return new Intl.NumberFormat('vi-VN').format(num || 0); }
    function getTodayString() {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }
    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      return parts.length === 3 ? `Ngày ${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }
    function toggleSheetModal(show) {
      const modal = document.getElementById('sheet-modal');
      if (show) modal.classList.remove('hidden'); else modal.classList.add('hidden');
      lucide.createIcons();
    }

    let currentTab = 'products';
    function switchTab(tab) {
      currentTab = tab;
      ['products', 'sales', 'giveaways', 'damaged', 'reports'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (btn) {
          btn.className = t === tab ? 'flex-1 flex flex-col items-center justify-center py-1 text-ios-blue' : 'flex-1 flex flex-col items-center justify-center py-1 text-slate-400';
        }
      });
      const titleEl = document.getElementById('page-title');
      if (tab === 'products') { if (titleEl) titleEl.innerText = 'Sản phẩm & Tồn kho'; renderProducts(); }
      else if (tab === 'sales') { if (titleEl) titleEl.innerText = 'Nhật ký Bán hàng'; renderSales(); }
      else if (tab === 'giveaways') { if (titleEl) titleEl.innerText = 'Quản lý Biếu tặng'; renderGiveaways(); }
      else if (tab === 'damaged') { if (titleEl) titleEl.innerText = 'Quản lý Hư hỏng'; renderDamaged(); }
      else if (tab === 'reports') { if (titleEl) titleEl.innerText = 'Báo cáo & Phân tích'; renderReports(); }
      lucide.createIcons();
    }

    // 1. PRODUCTS TAB
    function toggleDailyImportsGroup(dateKey) {
      openDailyImportsMap[dateKey] = !openDailyImportsMap[dateKey];
      renderProducts();
      lucide.createIcons();
    }

    function renderProducts() {
      const container = document.getElementById('app-content');
      let html = `
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 border border-slate-100">
          <h2 class="text-base font-semibold mb-3 flex items-center text-slate-800">
            <i data-lucide="plus-circle" class="w-5 h-5 mr-2 text-ios-blue"></i> Thêm / Nhập thêm sản phẩm
          </h2>
          <form onsubmit="handleAddProduct(event)" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Tên sản phẩm</label>
                <input type="text" id="p-name" required placeholder="Khoai mật, Củ cải..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Đơn vị tính</label>
                <input type="text" id="p-unit" required placeholder="kg, cây, quả..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Ngày nhập</label>
                <input type="date" id="p-date" value="${getTodayString()}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Số lượng nhập</label>
                <input type="number" step="any" id="p-qty" oninput="calcProductPrices()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Tổng giá nhập đợt này (VND)</label>
              <input type="number" id="p-total-cost" oninput="calcProductPrices()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>
            <div class="bg-blue-50/60 rounded-xl p-3 grid grid-cols-2 gap-2 border border-blue-100 text-xs">
              <div>
                <span class="text-slate-500 block">Giá nhập TB / ĐVT:</span>
                <span id="p-avg-cost-preview" class="font-bold text-slate-800">0 đ</span>
              </div>
              <div>
                <span class="text-slate-500 block">Gợi ý giá bán (>50% lãi):</span>
                <span id="p-min-price-preview" class="font-bold text-ios-green">0 đ</span>
              </div>
            </div>
            <button type="submit" class="w-full bg-ios-blue text-white font-medium py-2.5 rounded-xl text-sm shadow-sm active:opacity-90">
              Lưu / Cộng Dồn Sản Phẩm
            </button>
          </form>
        </div>
        <div class="space-y-3 mb-6">
          <h2 class="text-sm font-semibold text-slate-500 px-1">Kho hiện tại (${db.products.length} sản phẩm)</h2>
          <div class="grid grid-cols-1 gap-2">
      `;

      if (db.products.length === 0) {
        html += `<div class="text-center py-6 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200"><p class="text-xs">Chưa có sản phẩm nào trong kho</p></div>`;
      } else {
        db.products.forEach(p => {
          const batchCount = p.batches ? p.batches.length : 1;
          html += `
            <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 flex justify-between items-center text-xs">
              <div>
                <span class="font-bold text-slate-900 text-sm">${p.name}</span>
                <p class="text-slate-500 mt-0.5">Số lô nhập: <b class="text-slate-700">${batchCount} đợt</b> | Tồn: <b class="text-emerald-600">${formatNum(p.currentStock)} ${p.unit}</b></p>
              </div>
              <div class="text-right flex items-center gap-2">
                <button onclick="deleteProduct('${p.id}')" class="text-slate-300 hover:text-ios-red p-1" title="Xóa sản phẩm">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        });
      }
      html += `</div></div><div class="space-y-3"><h2 class="text-sm font-semibold text-slate-500 px-1">Nhật ký nhập hàng theo ngày</h2>`;

      const validImports = db.imports || [];
      if (validImports.length === 0) {
        html += `<div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200"><i data-lucide="package-plus" class="w-10 h-10 mx-auto mb-2 opacity-50"></i><p class="text-sm">Chưa có lịch sử nhập hàng</p></div>`;
      } else {
        let dailyImportMap = {};
        validImports.forEach(imp => {
          const dateKey = imp.date || 'Chưa rõ ngày';
          if (!dailyImportMap[dateKey]) dailyImportMap[dateKey] = { totalMoney: 0, items: [] };
          dailyImportMap[dateKey].totalMoney += (imp.totalCost || 0);
          dailyImportMap[dateKey].items.push(imp);
        });
        const sortedImportDates = Object.keys(dailyImportMap).sort().reverse();
        if (sortedImportDates.length > 0 && openDailyImportsMap[sortedImportDates[0]] === undefined) {
          openDailyImportsMap[sortedImportDates[0]] = true;
        }
        sortedImportDates.forEach(dateKey => {
          const group = dailyImportMap[dateKey];
          const isOpen = !!openDailyImportsMap[dateKey];
          html += `
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden mb-3">
              <div onclick="toggleDailyImportsGroup('${dateKey}')" class="p-4 bg-slate-50/80 flex items-center justify-between cursor-pointer hover:bg-slate-100/80 transition-colors select-none border-b border-slate-100">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-900 text-sm flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4 text-ios-blue"></i> ${formatDateDisplay(dateKey)}</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">${group.items.length} mặt hàng</span>
                  </div>
                  <p class="text-xs text-slate-500 mt-1">Tổng tiền ngày nhập: <b class="text-slate-900 font-bold">${formatMoney(group.totalMoney)}</b></p>
                </div>
                <div class="flex items-center gap-2">
                  <i data-lucide="chevron-down" class="w-5 h-5 text-slate-400 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}"></i>
                </div>
              </div>
              ${isOpen ? `
                <div class="p-3 space-y-2 bg-white">
                  ${group.items.map(imp => {
                    return `
                      <div class="bg-slate-50/60 rounded-xl p-3 flex justify-between items-center border border-slate-100">
                        <div>
                          <span class="font-bold text-slate-800 text-xs">${imp.productName}</span>
                          <p class="text-[11px] text-slate-500 mt-0.5">Số lượng: <b class="text-slate-700">${formatNum(imp.qty)} ${imp.unit}</b></p>
                        </div>
                        <div class="text-right flex items-center gap-2.5">
                          <p class="text-xs font-bold text-slate-900">${formatMoney(imp.totalCost)}</p>
                          <button onclick="deleteImport('${imp.id}')" class="text-slate-300 hover:text-ios-red p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          `;
        });
      }
      html += `</div>`;
      container.innerHTML = html;
    }

    function calcProductPrices() {
      const qty = parseFloat(document.getElementById('p-qty').value) || 0;
      const totalCost = parseFloat(document.getElementById('p-total-cost').value) || 0;
      let avgCost = qty > 0 && totalCost > 0 ? totalCost / qty : 0;
      let minSuggest = avgCost * 1.5;
      document.getElementById('p-avg-cost-preview').innerText = formatMoney(avgCost);
      document.getElementById('p-min-price-preview').innerText = formatMoney(minSuggest);
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const name = document.getElementById('p-name').value.trim();
      const unit = document.getElementById('p-unit').value.trim();
      const date = document.getElementById('p-date').value;
      const importQty = parseFloat(document.getElementById('p-qty').value) || 0;
      const totalImportCost = parseFloat(document.getElementById('p-total-cost').value) || 0;

      if (importQty <= 0) { alert("Số lượng nhập phải lớn hơn 0!"); return; }

      let prod = db.products.find(p => p.name.toLowerCase() === name.toLowerCase());
      let productId = '';

      if (!prod) {
        productId = 'P_' + Date.now();
        prod = {
          id: productId,
          name,
          unit,
          currentStock: 0,
          batches: []
        };
        db.products.push(prod);
      } else {
        productId = prod.id;
        prod.unit = unit;
        if (!prod.batches) prod.batches = [];
      }

      prod.batches.push({
        batchId: 'BATCH_' + Date.now(),
        date,
        qty: importQty,
        cost: totalImportCost,
        recoveredRevenue: 0
      });

      prod.currentStock = (prod.currentStock || 0) + importQty;

      if (!db.imports) db.imports = [];
      db.imports.push({
        id: 'IMP_' + Date.now(),
        date,
        productId,
        productName: name,
        unit,
        qty: importQty,
        totalCost: totalImportCost
      });

      openDailyImportsMap[date] = true;
      saveDB();
      renderProducts();
      lucide.createIcons();
    }

    function deleteImport(importId) {
      if (confirm("Bạn có chắc muốn xóa đợt nhập hàng này?")) {
        const imp = (db.imports || []).find(i => i.id === importId);
        if (imp) {
          const prod = db.products.find(p => p.id === imp.productId);
          if (prod) {
            prod.currentStock -= imp.qty;
            if (prod.batches) {
              prod.batches = prod.batches.filter(b => b.cost !== imp.totalCost || b.qty !== imp.qty);
            }
            if (prod.currentStock <= 0 && (!prod.batches || prod.batches.length === 0)) {
              db.products = db.products.filter(p => p.id !== prod.id);
            }
          }
          db.imports = db.imports.filter(i => i.id !== importId);
          saveDB();
          renderProducts();
          lucide.createIcons();
        }
      }
    }

    function deleteProduct(id) {
      if (confirm("Xóa sản phẩm này sẽ XÓA TOÀN BỘ lịch sử liên quan. Bạn có chắc chắn?")) {
        db.products = db.products.filter(p => p.id !== id);
        db.imports = (db.imports || []).filter(i => i.productId !== id);

    function onSelectSaleProduct() {
      const pId = document.getElementById('s-product-id').value;
      const prod = db.products.find(p => p.id === pId);
      if (prod && prod.batches && prod.batches.length > 0) {
        const totalCost = prod.batches.reduce((sum, b) => sum + b.cost, 0);
        const totalQty = prod.batches.reduce((sum, b) => sum + b.qty, 0);
        let avgCost = totalQty > 0 ? totalCost / totalQty : 0;
        const qty = parseFloat(document.getElementById('s-qty').value) || 0;
        if (qty > 0) document.getElementById('s-total-revenue').value = Math.round(qty * avgCost * 1.5);
        calcSalePreview();
      }
    }

    function calcSalePreview() {
      const pId = document.getElementById('s-product-id').value;
      const qty = parseFloat(document.getElementById('s-qty').value) || 0;
      const totalRevenue = parseFloat(document.getElementById('s-total-revenue').value) || 0;
      const prod = db.products.find(p => p.id === pId);
      let unitPrice = qty > 0 ? totalRevenue / qty : 0;

      let estimatedCost = 0;
      if (prod && prod.batches) {
        const totalC = prod.batches.reduce((sum, x) => sum + x.cost, 0);
        const totalQ = prod.batches.reduce((sum, x) => sum + x.qty, 0);
        let avgC = totalQ > 0 ? totalC / totalQ : 0;
        estimatedCost = qty * avgC;
      }

      let profit = totalRevenue - estimatedCost;
      document.getElementById('s-unit-price-preview').innerText = formatMoney(unitPrice) + ' / đvt';
      document.getElementById('s-profit-preview').innerText = formatMoney(profit);
    }

    function handleAddSale(e) {
      e.preventDefault();
      const productId = document.getElementById('s-product-id').value;
      const date = document.getElementById('s-date').value;
      const qty = parseFloat(document.getElementById('s-qty').value) || 0;
      const totalRevenue = parseFloat(document.getElementById('s-total-revenue').value) || 0;
      const prod = db.products.find(p => p.id === productId);

      if (!prod) { alert("Vui lòng chọn sản phẩm!"); return; }
      if (qty <= 0) { alert("Số lượng bán phải lớn hơn 0!"); return; }
      if (qty > prod.currentStock && !confirm(`Số lượng bán (${qty}) vượt quá tồn kho hiện tại (${prod.currentStock} ${prod.unit}). Tiếp tục?`)) return;

      let remainingQtyToSell = qty;
      let revenuePerUnit = totalRevenue / qty;
      let totalCostCalculated = 0;

      if (prod.batches) {
        for (let batch of prod.batches) {
          if (batch.qty > 0 && remainingQtyToSell > 0) {
            let qtyFromBatch = Math.min(batch.qty, remainingQtyToSell);
            if (!batch.originalQty) batch.originalQty = batch.qty;

            let costOfThisPart = batch.cost > 0 ? qtyFromBatch * (batch.cost / (batch.originalQty || batch.qty)) : 0;
            totalCostCalculated += costOfThisPart;

            batch.qty -= qtyFromBatch;
            batch.recoveredRevenue = (batch.recoveredRevenue || 0) + (qtyFromBatch * revenuePerUnit);

            remainingQtyToSell -= qtyFromBatch;
          }
        }
      }

      const profit = totalRevenue - totalCostCalculated;
      const actualUnitPrice = totalRevenue / qty;
      const marginPercent = totalRevenue > 0 ? ((profit / totalRevenue) * 100).toFixed(1) : 0;

      prod.currentStock -= qty;
      openDailySalesMap[date] = true;

      db.sales.push({
        id: 'S_' + Date.now(),
        date,
        productId,
        qty,
        totalRevenue,
        actualUnitPrice,
        totalCost: totalCostCalculated,
        profit,
        marginPercent
      });

      saveDB();
      renderSales();
      lucide.createIcons();
    }

    function deleteSale(saleId) {
      if (confirm("Bạn muốn xóa đơn bán này?")) {
        const sale = db.sales.find(s => s.id === saleId);
        if (sale) {
          const prod = db.products.find(p => p.id === sale.productId);
          if (prod) {
            prod.currentStock += sale.qty;
            if (prod.batches && prod.batches.length > 0) {
              prod.batches[prod.batches.length - 1].qty += sale.qty;
              prod.batches[prod.batches.length - 1].recoveredRevenue -= sale.totalRevenue;
            }
          }
          db.sales = db.sales.filter(s => s.id !== saleId);
          saveDB();
          renderSales();
          lucide.createIcons();
        }
      }
    }

      const note = document.getElementById('d-note').value.trim();
      const prod = db.products.find(p => p.id === productId);

      if (!prod) { alert("Vui lòng chọn sản phẩm!"); return; }
      if (qty <= 0) { alert("Số lượng hư hỏng phải lớn hơn 0!"); return; }
      if (qty > prod.currentStock && !confirm(`Số lượng báo hỏng vượt quá tồn kho. Tiếp tục?`)) return;

      let totalC = prod.batches ? prod.batches.reduce((sum, x) => sum + x.cost, 0) : 0;
      let totalQ = prod.batches ? prod.batches.reduce((sum, x) => sum + x.qty, 0) : 0;
      let avgC = totalQ > 0 ? totalC / totalQ : 0;
      const costValue = qty * avgC;

      prod.currentStock -= qty;
      if (!db.damaged) db.damaged = [];
      db.damaged.push({ id: 'D_' + Date.now(), date, productId, qty, note, costValue });
      saveDB();
      renderDamaged();
      lucide.createIcons();
    }

    function deleteDamaged(damagedId) {
      if (confirm("Bạn muốn xóa ghi nhận hư hỏng này?")) {
        const damagedItem = db.damaged.find(d => d.id === damagedId);
        if (damagedItem) {
          const prod = db.products.find(p => p.id === damagedItem.productId);
          if (prod) prod.currentStock += damagedItem.qty;
          db.damaged = db.damaged.filter(d => d.id !== damagedId);
          saveDB();
          renderDamaged();
          lucide.createIcons();
        }
      }
    }

    // 5. REPORTS TAB
    function renderReports() {
      const container = document.getElementById('app-content');
      const todayStr = getTodayString();
      const validSales = db.sales ? db.sales.filter(s => db.products.some(p => p.id === s.productId)) : [];

      let totalRevenue = 0;
      validSales.forEach(s => { totalRevenue += (s.totalRevenue || 0); });

      let totalImportBudget = 0;
      if (db.products) {
        db.products.forEach(p => {
          if (p.batches) {
            p.batches.forEach(b => totalImportBudget += (b.cost || 0));
          }
        });
      }

      let totalWithdrawableProfit = 0;
      let profitDetails = [];

      if (db.products) {
        db.products.forEach(p => {
          let totalCostP = p.batches ? p.batches.reduce((sum, b) => sum + (b.cost || 0), 0) : 0;
          let totalRecoveredP = p.batches ? p.batches.reduce((sum, b) => sum + (b.recoveredRevenue || 0), 0) : 0;
          let stock = p.currentStock || 0;

          let pTodaySales = validSales.filter(s => s.productId === p.id && s.date === todayStr);
          let pTodayRev = pTodaySales.reduce((sum, s) => sum + (s.totalRevenue || 0), 0);

          // Trường hợp vốn = 0 nhưng có doanh thu (hàng cho tặng bán ra) -> 100% doanh thu là lãi thuần
          if (totalCostP === 0 && totalRecoveredP > 0) {
            totalWithdrawableProfit += pTodayRev;
            profitDetails.push({
              name: p.name,
              type: 'green',
              text: `🟢 <b>${p.name}</b>: +${formatMoney(pTodayRev)} <span class="text-[10px] text-emerald-600">(Hàng vốn 0đ -> Lãi thuần 100%)</span>`
            });
          } else if (totalRecoveredP >= totalCostP) {
            // ĐÃ HOÀ VỐN HOẶC LÃI
            totalWithdrawableProfit += pTodayRev;
            profitDetails.push({
              name: p.name,
              type: 'green',
              text: `🟢 <b>${p.name}</b>: +${formatMoney(pTodayRev)} <span class="text-[10px] text-emerald-600">(Đã hoàn vốn -> Rút 100% doanh thu hôm nay)</span>`
            });
          } else if (stock === 0) {
            // TỒN KHO BẰNG 0 NHƯNG THU HỒI < VỐN NHẬP -> LỖ (ĐỎ)
            let itemLoss = totalCostP - totalRecoveredP;
            totalWithdrawableProfit -= itemLoss;
            profitDetails.push({
              name: p.name,
              type: 'red',
              text: `🔴 <b>${p.name}</b>: Lỗ ${formatMoney(itemLoss)} <span class="text-[10px] text-red-600">(Đã hết hàng, thu không đủ vốn)</span>`
            });
          } else {
            // ĐANG TRONG QUÁ TRÌNH HOÀN VỐN (VÀNG)
            let remaining = Math.max(totalCostP - totalRecoveredP, 0);
            profitDetails.push({
              name: p.name,
              type: 'yellow',
              text: `🟡 <b>${p.name}</b>: Đang hoàn vốn (Còn thiếu ${formatMoney(remaining)} mới đủ gốc)`
            });
          }
        });
      }

      let html = `
        <!-- THẺ GỢI Ý RÚT TIỀN LÃI HÔM NAY -->
        <div class="bg-emerald-500 text-white rounded-2xl p-4 shadow-md mb-4 space-y-2">
          <div class="flex justify-between items-center border-b border-emerald-400/60 pb-2">
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-100 flex items-center gap-1.5">
              <i data-lucide="wallet" class="w-4 h-4"></i> Tiền lãi có thể rút bỏ ví hôm nay
            </span>
            <span class="text-[10px] font-bold bg-white/20 px-2 py-0.5 rounded-full">${formatDateDisplay(todayStr)}</span>
          </div>
          <div>
            <p class="text-3xl font-black">${formatMoney(totalWithdrawableProfit)}</p>
            <p class="text-[11px] text-emerald-100 mt-0.5">Tổng lãi thu về sau khi đã bù trừ lỗ và hoàn vốn gốc</p>
          </div>
          <div class="bg-white/95 text-slate-800 rounded-xl p-3 space-y-1.5 mt-2">
            ${profitDetails.length > 0 ? profitDetails.map(d => d.text).join('') : '<p class="text-xs text-slate-400">Chưa có dữ liệu sản phẩm</p>'}
          </div>
        </div>

        <!-- TỔNG QUAN TÀI CHÍNH -->
        <div class="grid grid-cols-1 gap-3 mb-4">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center">
            <div>
              <p class="text-xs text-slate-400 font-medium">1. Tổng Vốn Đã Chi Nhập Hàng</p>
              <p class="text-xl font-extrabold text-slate-900 mt-0.5">${formatMoney(totalImportBudget)}</p>
            </div>
            <div class="w-10 h-10 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center">
              <i data-lucide="arrow-down-left" class="w-5 h-5"></i>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center">
            <div>
              <p class="text-xs text-slate-400 font-medium">2. Tổng Tiền Đã Thu Về (Doanh Thu)</p>
              <p class="text-xl font-extrabold text-ios-blue mt-0.5">${formatMoney(totalRevenue)}</p>
            </div>
            <div class="w-10 h-10 bg-blue-50 text-ios-blue rounded-full flex items-center justify-center">
              <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
            </div>
          </div>
        </div>

        <!-- TRẠNG THÁI TỪNG MẶT HÀNG -->
        <div class="space-y-3">
          <h2 class="text-sm font-semibold text-slate-500 px-1">Trạng thái thu hồi vốn & Lãi/Lỗ từng mặt hàng</h2>
      `;

      if (!db.products || db.products.length === 0) {
        html += `<div class="text-center py-6 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200"><p class="text-xs">Chưa có sản phẩm nào</p></div>`;
      } else {
        db.products.forEach(p => {
          let totalCostP = p.batches ? p.batches.reduce((sum, b) => sum + (b.cost || 0), 0) : 0;
          let totalRecoveredP = p.batches ? p.batches.reduce((sum, b) => sum + (b.recoveredRevenue || 0), 0) : 0;
          let stock = p.currentStock || 0;

          let badgeClass = '';
          let badgeText = '';
          let detailBox = '';

          if (totalCostP === 0 && totalRecoveredP > 0) {
            // XANH (VỐN 0Đ NHƯNG CÓ DOANH THU -> LÃI THUẦN)
            badgeClass = 'text-emerald-700 bg-emerald-50 border-emerald-200';
            badgeText = '🟢 LÃI THUẦN (VỐN 0Đ)';
            detailBox = `
              <p class="text-emerald-600 font-bold">Lãi thực tế: +${formatMoney(totalRecoveredP)}</p>
              <p class="text-[10px] text-emerald-600">Hàng không mất vốn gốc</p>
            `;
          } else if (totalRecoveredP >= totalCostP) {
            // XANH (LÃI / ĐÃ HOÀ VỐN)
            let itemProfit = totalRecoveredP - totalCostP;
            badgeClass = 'text-emerald-700 bg-emerald-50 border-emerald-200';
            badgeText = '🟢 ĐÃ HOÀ VỐN / CÓ LÃI';
            detailBox = `
              <p class="text-emerald-600 font-bold">Lãi thực tế: +${formatMoney(itemProfit)}</p>
              <p class="text-[10px] text-emerald-600">Đã hoàn 100% vốn gốc</p>
            `;
          } else if (stock === 0) {
            // ĐỎ (HẾT HÀNG MÀ THU HỒI < VỐN -> LỖ)
            let itemLoss = totalCostP - totalRecoveredP;
            badgeClass = 'text-red-700 bg-red-50 border-red-200';
            badgeText = '🔴 ĐÃ LỖ (HẾT HÀNG)';
            detailBox = `
              <p class="text-red-600 font-bold">Thâm hụt (Lỗ): -${formatMoney(itemLoss)}</p>
              <p class="text-[10px] text-red-500">Tồn kho = 0 nhưng chưa thu đủ vốn</p>
            `;
          } else {
            // VÀNG (ĐANG HOÀ VỐN)
            let percent = totalCostP > 0 ? Math.min(Math.round((totalRecoveredP / totalCostP) * 100), 100) : 0;
            let remaining = Math.max(totalCostP - totalRecoveredP, 0);
            badgeClass = 'text-amber-700 bg-amber-50 border-amber-200';
            badgeText = `🟡 Đang hoàn vốn (${percent}%)`;
            detailBox = `
              <p class="text-amber-700 font-bold">Còn thiếu để đủ gốc:</p>
              <p class="text-slate-900 font-black">${formatMoney(remaining)}</p>
            `;
          }

          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
              <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <div>
                  <span class="font-bold text-slate-900 text-base">${p.name}</span>
                  <span class="text-xs text-slate-400 block">Tồn kho: <b>${formatNum(stock)} ${p.unit}</b></span>
                </div>
                <span class="text-xs font-bold px-2.5 py-1 rounded-full border ${badgeClass}">
                  ${badgeText}
                </span>
              </div>

              <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl">
                <div>
                  <p>Tổng vốn nhập: <b class="text-slate-800">${formatMoney(totalCostP)}</b></p>
                  <p>Đã thu hồi: <b class="text-ios-blue">${formatMoney(totalRecoveredP)}</b></p>
                </div>
                <div class="text-right">
                  ${detailBox}
                </div>
              </div>
            </div>
          `;
        });
      }
      html += `</div>`;
      container.innerHTML = html;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `quanlykho_backup_${getTodayString()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.onload = function() {
      loadDB();
      switchTab('products');
    };
  </script>
</body>
</html>
