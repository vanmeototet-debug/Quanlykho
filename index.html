<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Quản lý Bán hàng & Tồn kho</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ios: {
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              orange: '#FF9500',
              pink: '#FF2D55',
              gray: '#8E8E93',
              bg: '#F2F2F7',
              card: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input, select, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
  </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 flex flex-col bg-ios-bg">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 pt-safe">
    <div class="px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-900 tracking-tight" id="page-title">Sản phẩm & Tồn kho</h1>
      <div class="flex items-center gap-1">
        <!-- Nút Cài đặt Google Sheet URL -->
        <button onclick="toggleSheetModal(true)" class="p-2 text-ios-green hover:bg-slate-100 rounded-full transition-colors relative" title="Kết nối Google Sheets">
          <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
          <span id="sheet-dot" class="absolute top-1.5 right-1.5 w-2 h-2 bg-slate-300 rounded-full"></span>
        </button>
        <!-- Nút Xuất dự phòng -->
        <button onclick="exportData()" class="p-2 text-slate-400 hover:bg-slate-100 rounded-full transition-colors" title="Xuất file JSON dự phòng">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Modal Cài đặt Google Sheets -->
  <div id="sheet-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">
          <i data-lucide="file-spreadsheet" class="w-5 h-5 text-ios-green"></i> Google Sheets Online
        </h3>
        <button onclick="toggleSheetModal(false)" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <p class="text-xs text-slate-500">
        Dán đường link <b>Apps Script Web App URL</b> từ Google Sheet của bạn vào đây để đồng bộ tự động online.
      </p>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Google Web App URL</label>
        <input type="text" id="sheet-url-input" placeholder="https://script.google.com/macros/s/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-ios-green font-mono">
      </div>
      <div class="pt-2 space-y-2">
        <button onclick="saveSheetUrl()" class="w-full bg-ios-green text-white font-medium py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm active:opacity-90">
          <i data-lucide="check" class="w-4 h-4"></i> Lưu & Đồng bộ ngay
        </button>
        <button onclick="toggleSheetModal(false)" class="w-full bg-slate-100 text-slate-700 font-medium py-2.5 rounded-xl text-xs">
          Đóng
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto p-4 pb-24" id="app-content">
    <!-- Dynamic Content injected by JS -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 z-30 pb-safe">
    <div class="flex justify-around items-center h-16 px-1">
      <button onclick="switchTab('products')" id="nav-products" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="package" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium mt-1">Sản phẩm</span>
      </button>
      <button onclick="switchTab('sales')" id="nav-sales" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium mt-1">Bán hàng</span>
      </button>
      <button onclick="switchTab('giveaways')" id="nav-giveaways" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400">
        <i data-lucide="gift" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium mt-1">Biếu tặng</span>
      </button>
      <button onclick="switchTab('reports')" id="nav-reports" class="flex-1 flex flex-col items-center justify-center py-1 text-ios-blue">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        <span class="text-[9px] font-medium mt-1">Báo cáo</span>
      </button>
    </div>
  </nav>

  <!-- JS Logic -->
  <script>
    let db = {
      products: [], 
      sales: [],
      giveaways: []
    };

    let googleSheetUrl = '';

    function loadDB() {
      const stored = localStorage.getItem('app_inventory_db');
      if (stored) {
        try {
          db = JSON.parse(stored);
          if (!db.giveaways) db.giveaways = [];
        } catch(e) {
          console.error("Lỗi đọc dữ liệu local", e);
        }
      }
      googleSheetUrl = localStorage.getItem('app_google_sheet_url') || '';
      if (googleSheetUrl) {
        document.getElementById('sheet-url-input').value = googleSheetUrl;
        document.getElementById('sheet-dot').className = 'absolute top-1.5 right-1.5 w-2 h-2 bg-emerald-500 rounded-full';
        fetchFromGoogleSheet();
      }
    }

    function saveDB() {
      localStorage.setItem('app_inventory_db', JSON.stringify(db));
      syncToGoogleSheet();
    }

    // Đẩy dữ liệu lên Google Sheet qua Form ẩn (Bỏ qua lỗi CORS & Redirect)
    function syncToGoogleSheet() {
      if (!googleSheetUrl) return;
      let form = document.getElementById('hidden-sync-form');
      if (!form) {
        form = document.createElement('form');
        form.id = 'hidden-sync-form';
        form.method = 'POST';
        form.action = googleSheetUrl;
        form.target = 'hidden-iframe';
        form.style.display = 'none';
        
        let input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.id = 'hidden-sync-payload';
        form.appendChild(input);
        
        let iframe = document.createElement('iframe');
        iframe.name = 'hidden-iframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        document.body.appendChild(form);
      }
      document.getElementById('hidden-sync-payload').value = JSON.stringify(db);
      form.submit();
    }

    // Lấy dữ liệu từ Google Sheet qua JSONP (Bỏ qua lỗi CORS)
    function fetchFromGoogleSheet() {
      if (!googleSheetUrl) return;
      const scriptId = 'jsonp-script';
      let oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      window.handleSheetData = function(data) {
        if (data && data.products) {
          db = data;
          if (!db.giveaways) db.giveaways = [];
          localStorage.setItem('app_inventory_db', JSON.stringify(db));
          switchTab(currentTab);
        }
      };

      const script = document.createElement('script');
      script.id = scriptId;
      script.src = googleSheetUrl + (googleSheetUrl.includes('?') ? '&' : '?') + 'callback=handleSheetData&t=' + Date.now();
      document.body.appendChild(script);
    }

    function saveSheetUrl() {
      const url = document.getElementById('sheet-url-input').value.trim();
      if (!url) {
        alert("Vui lòng nhập đường link Web App URL!");
        return;
      }
      googleSheetUrl = url;
      localStorage.setItem('app_google_sheet_url', googleSheetUrl);
      document.getElementById('sheet-dot').className = 'absolute top-1.5 right-1.5 w-2 h-2 bg-emerald-500 rounded-full';
      fetchFromGoogleSheet();
      alert("Đã kết nối thành công với Google Sheets!");
      toggleSheetModal(false);
    }

    function formatMoney(num) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num || 0);
    }

    function formatNum(num) {
      return new Intl.NumberFormat('vi-VN').format(num || 0);
    }

    function getTodayString() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function toggleSheetModal(show) {
      const modal = document.getElementById('sheet-modal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
      lucide.createIcons();
    }

    let currentTab = 'products';

    function switchTab(tab) {
      currentTab = tab;
      
      ['products', 'sales', 'giveaways', 'reports'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tab) {
          btn.className = 'flex-1 flex flex-col items-center justify-center py-1 text-ios-blue';
        } else {
          btn.className = 'flex-1 flex flex-col items-center justify-center py-1 text-slate-400';
        }
      });

      const titleEl = document.getElementById('page-title');
      if (tab === 'products') {
        titleEl.innerText = 'Sản phẩm & Tồn kho';
        renderProducts();
      } else if (tab === 'sales') {
        titleEl.innerText = 'Nhật ký Bán hàng';
        renderSales();
      } else if (tab === 'giveaways') {
        titleEl.innerText = 'Quản lý Biếu tặng';
        renderGiveaways();
      } else if (tab === 'reports') {
        titleEl.innerText = 'Báo cáo Tổng hợp';
        renderReports();
      }

      lucide.createIcons();
    }

    // ==========================================
    // 1. PRODUCTS TAB (SẢN PHẨM & TỒN KHO)
    // ==========================================
    function renderProducts() {
      const container = document.getElementById('app-content');
      
      let html = `
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 border border-slate-100">
          <h2 class="text-base font-semibold mb-3 flex items-center text-slate-800">
            <i data-lucide="plus-circle" class="w-5 h-5 mr-2 text-ios-blue"></i> Thêm / Nhập thêm sản phẩm
          </h2>
          <form onsubmit="handleAddProduct(event)" class="space-y-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Tên sản phẩm</label>
              <input type="text" id="p-name" required placeholder="VD: Gấc, Cam Sành, Khoai lang..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Đơn vị tính</label>
                <input type="text" id="p-unit" required placeholder="kg, quả, túi..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Số lượng nhập thêm</label>
                <input type="number" step="any" id="p-qty" oninput="calcProductPrices()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-500 mb-1">Tổng giá nhập đợt này (VND)</label>
              <input type="number" id="p-total-cost" oninput="calcProductPrices()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>

            <div class="bg-blue-50/60 rounded-xl p-3 grid grid-cols-2 gap-2 border border-blue-100 text-xs">
              <div>
                <span class="text-slate-500 block">Giá nhập TB / ĐVT:</span>
                <span id="p-avg-cost-preview" class="font-bold text-slate-800">0 đ</span>
              </div>
              <div>
                <span class="text-slate-500 block">Gợi ý giá bán (>50% lãi):</span>
                <span id="p-min-price-preview" class="font-bold text-ios-green">0 đ</span>
              </div>
            </div>

            <button type="submit" class="w-full bg-ios-blue text-white font-medium py-2.5 rounded-xl text-sm shadow-sm active:opacity-90">
              Lưu / Cộng Dồn Sản Phẩm
            </button>
          </form>
        </div>

        <div class="space-y-3">
          <h2 class="text-sm font-semibold text-slate-500 px-1">Danh sách sản phẩm (${db.products.length})</h2>
      `;

      if (db.products.length === 0) {
        html += `
          <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <i data-lucide="package-x" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p class="text-sm">Chưa có sản phẩm nào</p>
          </div>
        `;
      } else {
        db.products.forEach(p => {
          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-start">
              <div class="space-y-1">
                <span class="font-bold text-slate-900 text-base">${p.name}</span>
                <div class="text-xs text-slate-500 space-y-0.5">
                  <p>Tổng Nhập: <b class="text-slate-700">${formatNum(p.importQty)} ${p.unit}</b> (Tổng tiền: ${formatMoney(p.totalImportCost)})</p>
                  <p>Giá nhập TB: <b class="text-slate-700">${formatMoney(p.avgImportCost)} / ${p.unit}</b></p>
                  <p>Gợi ý giá bán (>50%): <b class="text-ios-green">${formatMoney(p.minSuggestPrice)} / ${p.unit}</b></p>
                </div>
              </div>
              <div class="text-right flex flex-col justify-between items-end h-full">
                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${p.currentStock > 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'}">
                  Tồn: ${formatNum(p.currentStock)} ${p.unit}
                </span>
                <button onclick="deleteProduct('${p.id}')" class="mt-4 text-slate-300 hover:text-ios-red p-1" title="Xóa sản phẩm">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function calcProductPrices() {
      const qty = parseFloat(document.getElementById('p-qty').value) || 0;
      const totalCost = parseFloat(document.getElementById('p-total-cost').value) || 0;

      let avgCost = 0;
      let minSuggest = 0;

      if (qty > 0 && totalCost > 0) {
        avgCost = totalCost / qty;
        minSuggest = avgCost * 1.5;
      }

      document.getElementById('p-avg-cost-preview').innerText = formatMoney(avgCost);
      document.getElementById('p-min-price-preview').innerText = formatMoney(minSuggest);
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const name = document.getElementById('p-name').value.trim();
      const unit = document.getElementById('p-unit').value.trim();
      const importQty = parseFloat(document.getElementById('p-qty').value) || 0;
      const totalImportCost = parseFloat(document.getElementById('p-total-cost').value) || 0;

      if (importQty <= 0) {
        alert("Số lượng nhập phải lớn hơn 0!");
        return;
      }

      let existingProd = db.products.find(p => p.name.toLowerCase() === name.toLowerCase());

      if (existingProd) {
        existingProd.importQty += importQty;
        existingProd.totalImportCost += totalImportCost;
        existingProd.currentStock += importQty;
        existingProd.avgImportCost = existingProd.totalImportCost / existingProd.importQty;
        existingProd.minSuggestPrice = existingProd.avgImportCost * 1.5;
        existingProd.unit = unit;
      } else {
        const avgImportCost = totalImportCost / importQty;
        const minSuggestPrice = avgImportCost * 1.5;

        const newProd = {
          id: 'P_' + Date.now(),
          name,
          unit,
          importQty,
          totalImportCost,
          avgImportCost,
          minSuggestPrice,
          currentStock: importQty
        };

        db.products.push(newProd);
      }

      saveDB();
      renderProducts();
      lucide.createIcons();
    }

    function deleteProduct(id) {
      if (confirm("Xóa sản phẩm này sẽ XÓA TOÀN BỘ lịch sử bán hàng và biếu tặng liên quan. Bạn có chắc chắn?")) {
        db.products = db.products.filter(p => p.id !== id);
        db.sales = db.sales.filter(s => s.productId !== id);
        if (db.giveaways) {
          db.giveaways = db.giveaways.filter(g => g.productId !== id);
        }
        saveDB();
        renderProducts();
        lucide.createIcons();
      }
    }

    // ==========================================
    // 2. SALES TAB (BÁN HÀNG)
    // ==========================================
    function renderSales() {
      const container = document.getElementById('app-content');

      let productOptions = db.products.map(p => 
        `<option value="${p.id}">${p.name} - Tồn: ${formatNum(p.currentStock)} ${p.unit}</option>`
      ).join('');

      let html = `
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 border border-slate-100">
          <h2 class="text-base font-semibold mb-3 flex items-center text-slate-800">
            <i data-lucide="shopping-bag" class="w-5 h-5 mr-2 text-ios-green"></i> Đơn bán hàng mới
          </h2>
          <form onsubmit="handleAddSale(event)" class="space-y-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Chọn Sản Phẩm</label>
              <select id="s-product-id" onchange="onSelectSaleProduct()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
                <option value="">-- Chọn sản phẩm --</option>
                ${productOptions}
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Ngày bán</label>
                <input type="date" id="s-date" value="${getTodayString()}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Số lượng bán</label>
                <input type="number" step="any" id="s-qty" oninput="calcSalePreview()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-500 mb-1">Tổng tiền khách trả (Tổng Doanh Thu - VND)</label>
              <input type="number" id="s-total-revenue" oninput="calcSalePreview()" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>

            <div class="bg-emerald-50/60 rounded-xl p-3 grid grid-cols-2 gap-2 border border-emerald-100 text-xs">
              <div>
                <span class="text-slate-500 block">Giá bán thực tế / ĐVT:</span>
                <span id="s-unit-price-preview" class="font-bold text-slate-800">0 đ</span>
              </div>
              <div>
                <span class="text-slate-500 block">Lợi Nhuận Dự Kiến:</span>
                <span id="s-profit-preview" class="font-bold text-ios-green">0 đ</span>
              </div>
            </div>

            <button type="submit" class="w-full bg-ios-green text-white font-medium py-2.5 rounded-xl text-sm shadow-sm active:opacity-90">
              Xác Nhận Bán Hàng
            </button>
          </form>
        </div>

        <div class="space-y-3">
          <h2 class="text-sm font-semibold text-slate-500 px-1">Lịch sử giao dịch bán</h2>
      `;

      const validSales = db.sales.filter(s => db.products.some(p => p.id === s.productId));

      if (validSales.length === 0) {
        html += `
          <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <i data-lucide="receipt" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p class="text-sm">Chưa có giao dịch bán nào</p>
          </div>
        `;
      } else {
        const sortedSales = [...validSales].reverse();
        sortedSales.forEach(s => {
          const prod = db.products.find(p => p.id === s.productId);
          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-900">${prod.name}</span>
                  <span class="text-xs text-slate-400">${s.date}</span>
                </div>
                <p class="text-xs text-slate-500 mt-1">
                  Đã bán: <b class="text-slate-700">${formatNum(s.qty)} ${prod.unit}</b> (Giá bán thực tế: ${formatMoney(s.actualUnitPrice)} / ${prod.unit})
                </p>
              </div>
              <div class="text-right flex items-center gap-3">
                <div>
                  <p class="text-sm font-bold text-slate-900">${formatMoney(s.totalRevenue)}</p>
                  <p class="text-xs font-semibold ${s.profit >= 0 ? 'text-ios-green' : 'text-ios-red'}">
                    Lãi: ${formatMoney(s.profit)}
                  </p>
                </div>
                <button onclick="deleteSale('${s.id}')" class="text-slate-300 hover:text-ios-red p-1" title="Xóa đơn bán">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function onSelectSaleProduct() {
      const pId = document.getElementById('s-product-id').value;
      const prod = db.products.find(p => p.id === pId);
      if (prod) {
        const qty = parseFloat(document.getElementById('s-qty').value) || 0;
        if (qty > 0) {
          document.getElementById('s-total-revenue').value = Math.round(qty * prod.minSuggestPrice);
        }
        calcSalePreview();
      }
    }

    function calcSalePreview() {
      const pId = document.getElementById('s-product-id').value;
      const qty = parseFloat(document.getElementById('s-qty').value) || 0;
      const totalRevenue = parseFloat(document.getElementById('s-total-revenue').value) || 0;

      const prod = db.products.find(p => p.id === pId);
      let unitPrice = 0;
      let profit = 0;

      if (qty > 0) {
        unitPrice = totalRevenue / qty;
      }

      if (prod && qty > 0) {
        let totalCost = qty * prod.avgImportCost;
        profit = totalRevenue - totalCost;
      }

      document.getElementById('s-unit-price-preview').innerText = formatMoney(unitPrice) + ' / đvt';
      document.getElementById('s-profit-preview').innerText = formatMoney(profit);
    }

    function handleAddSale(e) {
      e.preventDefault();
      const productId = document.getElementById('s-product-id').value;
      const date = document.getElementById('s-date').value;
      const qty = parseFloat(document.getElementById('s-qty').value) || 0;
      const totalRevenue = parseFloat(document.getElementById('s-total-revenue').value) || 0;

      const prod = db.products.find(p => p.id === productId);
      if (!prod) {
        alert("Vui lòng chọn sản phẩm!");
        return;
      }

      if (qty <= 0) {
        alert("Số lượng bán phải lớn hơn 0!");
        return;
      }

      if (qty > prod.currentStock) {
        if (!confirm(`Số lượng bán (${qty}) vượt quá tồn kho hiện tại (${prod.currentStock} ${prod.unit}). Bạn có muốn tiếp tục?`)) {
          return;
        }
      }

      const totalCost = qty * prod.avgImportCost;
      const profit = totalRevenue - totalCost;
      const actualUnitPrice = totalRevenue / qty;

      prod.currentStock -= qty;

      db.sales.push({
        id: 'S_' + Date.now(),
        date,
        productId,
        qty,
        totalRevenue,
        actualUnitPrice,
        totalCost,
        profit
      });

      saveDB();
      renderSales();
      lucide.createIcons();
    }

    function deleteSale(saleId) {
      if (confirm("Bạn muốn xóa đơn bán này? (Số lượng tồn kho sẽ được cộng trả lại)")) {
        const sale = db.sales.find(s => s.id === saleId);
        if (sale) {
          const prod = db.products.find(p => p.id === sale.productId);
          if (prod) {
            prod.currentStock += sale.qty;
          }
          db.sales = db.sales.filter(s => s.id !== saleId);
          saveDB();
          renderSales();
          lucide.createIcons();
        }
      }
    }

    // ==========================================
    // 3. GIVEAWAYS TAB (BIẾU TẶNG)
    // ==========================================
    function renderGiveaways() {
      const container = document.getElementById('app-content');

      let productOptions = db.products.map(p => 
        `<option value="${p.id}">${p.name} - Tồn: ${formatNum(p.currentStock)} ${p.unit}</option>`
      ).join('');

      let html = `
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6 border border-slate-100">
          <h2 class="text-base font-semibold mb-3 flex items-center text-slate-800">
            <i data-lucide="gift" class="w-5 h-5 mr-2 text-ios-pink"></i> Ghi nhận biếu tặng (nhà ăn, từ thiện...)
          </h2>
          <form onsubmit="handleAddGiveaway(event)" class="space-y-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Chọn Sản Phẩm Biếu</label>
              <select id="g-product-id" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
                <option value="">-- Chọn sản phẩm --</option>
                ${productOptions}
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Ngày biếu</label>
                <input type="date" id="g-date" value="${getTodayString()}" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Số lượng biếu</label>
                <input type="number" step="any" id="g-qty" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-500 mb-1">Ghi chú (VD: Biếu nhà ăn số 2)</label>
              <input type="text" id="g-note" placeholder="Nhập tên người nhận hoặc địa điểm..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ios-blue">
            </div>

            <button type="submit" class="w-full bg-ios-pink text-white font-medium py-2.5 rounded-xl text-sm shadow-sm active:opacity-90">
              Xác Nhận Biếu Tặng
            </button>
          </form>
        </div>

        <div class="space-y-3">
          <h2 class="text-sm font-semibold text-slate-500 px-1">Lịch sử biếu tặng</h2>
      `;

      const validGiveaways = (db.giveaways || []).filter(g => db.products.some(p => p.id === g.productId));

      if (validGiveaways.length === 0) {
        html += `
          <div class="text-center py-8 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <i data-lucide="heart-handshake" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p class="text-sm">Chưa có lịch sử biếu tặng nào</p>
          </div>
        `;
      } else {
        const sortedGiveaways = [...validGiveaways].reverse();
        sortedGiveaways.forEach(g => {
          const prod = db.products.find(p => p.id === g.productId);
          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-900">${prod.name}</span>
                  <span class="text-xs text-slate-400">${g.date}</span>
                </div>
                <p class="text-xs text-slate-600 mt-1 font-medium">Đã biếu: <b class="text-ios-pink">${formatNum(g.qty)} ${prod.unit}</b></p>
                ${g.note ? `<p class="text-[11px] text-slate-400 mt-0.5">📝 ${g.note}</p>` : ''}
              </div>
              <div class="text-right flex items-center gap-3">
                <span class="text-xs font-bold bg-pink-50 text-ios-pink px-2.5 py-1 rounded-full">
                  Vốn: ${formatMoney(g.costValue)}
                </span>
                <button onclick="deleteGiveaway('${g.id}')" class="text-slate-300 hover:text-ios-red p-1" title="Xóa lịch sử biếu">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function handleAddGiveaway(e) {
      e.preventDefault();
      const productId = document.getElementById('g-product-id').value;
      const date = document.getElementById('g-date').value;
      const qty = parseFloat(document.getElementById('g-qty').value) || 0;
      const note = document.getElementById('g-note').value.trim();

      const prod = db.products.find(p => p.id === productId);
      if (!prod) {
        alert("Vui lòng chọn sản phẩm!");
        return;
      }

      if (qty <= 0) {
        alert("Số lượng biếu phải lớn hơn 0!");
        return;
      }

      if (qty > prod.currentStock) {
        if (!confirm(`Số lượng biếu (${qty}) vượt quá tồn kho hiện tại (${prod.currentStock} ${prod.unit}). Bạn có muốn tiếp tục?`)) {
          return;
        }
      }

      const costValue = qty * prod.avgImportCost;

      prod.currentStock -= qty;

      if (!db.giveaways) db.giveaways = [];
      db.giveaways.push({
        id: 'G_' + Date.now(),
        date,
        productId,
        qty,
        note,
        costValue
      });

      saveDB();
      renderGiveaways();
      lucide.createIcons();
    }

    function deleteGiveaway(giveawayId) {
      if (confirm("Bạn muốn xóa lượt biếu này? (Số lượng tồn kho sẽ được cộng trả lại)")) {
        const giveaway = db.giveaways.find(g => g.id === giveawayId);
        if (giveaway) {
          const prod = db.products.find(p => p.id === giveaway.productId);
          if (prod) {
            prod.currentStock += giveaway.qty;
          }
          db.giveaways = db.giveaways.filter(g => g.id !== giveawayId);
          saveDB();
          renderGiveaways();
          lucide.createIcons();
        }
      }
    }

    // ==========================================
    // 4. REPORTS TAB (BÁO CÁO TỔNG HỢP & CHI TIẾT)
    // ==========================================
    function renderReports() {
      const container = document.getElementById('app-content');

      const validSales = db.sales.filter(s => db.products.some(p => p.id === s.productId));
      const validGiveaways = (db.giveaways || []).filter(g => db.products.some(p => p.id === g.productId));

      let totalRevenue = 0;
      let totalCost = 0;
      let totalProfit = 0;
      validSales.forEach(s => {
        totalRevenue += s.totalRevenue;
        totalCost += s.totalCost;
        totalProfit += s.profit;
      });

      let totalGiveawayValue = 0;
      validGiveaways.forEach(g => {
        totalGiveawayValue += g.costValue;
      });

      let html = `
        <div class="grid grid-cols-1 gap-3 mb-6">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400 font-medium">Tổng Doanh Thu Bán Hàng</p>
              <p class="text-xl font-extrabold text-slate-900 mt-0.5">${formatMoney(totalRevenue)}</p>
            </div>
            <div class="w-10 h-10 bg-blue-50 text-ios-blue rounded-full flex items-center justify-center">
              <i data-lucide="trending-up" class="w-5 h-5"></i>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400 font-medium">Lợi Nhuận Kinh Doanh</p>
              <p class="text-2xl font-black ${totalProfit >= 0 ? 'text-ios-green' : 'text-ios-red'} mt-0.5">${formatMoney(totalProfit)}</p>
            </div>
            <div class="w-10 h-10 ${totalProfit >= 0 ? 'bg-emerald-50 text-ios-green' : 'bg-red-50 text-red-500'} rounded-full flex items-center justify-center">
              <i data-lucide="piggy-bank" class="w-5 h-5"></i>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400 font-medium">Tổng Giá Trị Đã Biếu Tặng</p>
              <p class="text-xl font-extrabold text-ios-pink mt-0.5">${formatMoney(totalGiveawayValue)}</p>
            </div>
            <div class="w-10 h-10 bg-pink-50 text-ios-pink rounded-full flex items-center justify-center">
              <i data-lucide="gift" class="w-5 h-5"></i>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <h2 class="text-sm font-semibold text-slate-500 px-1">Chi tiết theo từng mặt hàng</h2>
      `;

      if (db.products.length === 0) {
        html += `
          <div class="text-center py-6 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <p class="text-xs">Chưa có sản phẩm nào để thống kê</p>
          </div>
        `;
      } else {
        db.products.forEach(p => {
          const itemSales = validSales.filter(s => s.productId === p.id);
          const soldQty = itemSales.reduce((sum, s) => sum + s.qty, 0);
          const itemRevenue = itemSales.reduce((sum, s) => sum + s.totalRevenue, 0);

          const itemGiveaways = validGiveaways.filter(g => g.productId === p.id);
          const giveawayQty = itemGiveaways.reduce((sum, g) => sum + g.qty, 0);
          const giveawayVal = itemGiveaways.reduce((sum, g) => sum + g.costValue, 0);

          const itemTotalImportCost = p.totalImportCost || 0;
          const itemRealProfit = itemRevenue - itemTotalImportCost;

          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2">
              <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <span class="font-bold text-slate-900 text-base">${p.name}</span>
                <span class="text-xs font-bold ${itemRealProfit >= 0 ? 'text-ios-green' : 'text-ios-red'}">
                  Lãi (Bán - Nhập): ${formatMoney(itemRealProfit)}
                </span>
              </div>
              <div class="grid grid-cols-2 gap-2 text-xs text-slate-500 bg-slate-50 p-2.5 rounded-xl">
                <div>
                  <p>Tổng Nhập: <b class="text-slate-700">${formatNum(p.importQty)} ${p.unit}</b></p>
                  <p>Đã Bán: <b class="text-slate-700">${formatNum(soldQty)} ${p.unit}</b></p>
                  <p>Đã Biếu: <b class="text-ios-pink">${formatNum(giveawayQty)} ${p.unit}</b></p>
                  <p>Tồn Kho: <b class="text-emerald-600">${formatNum(p.currentStock)} ${p.unit}</b></p>
                </div>
                <div class="text-right space-y-0.5">
                  <p>Tổng tiền nhập: <b class="text-slate-800">${formatMoney(itemTotalImportCost)}</b></p>
                  <p>Tổng tiền bán: <b class="text-slate-800">${formatMoney(itemRevenue)}</b></p>
                  <p>Vốn biếu tặng: <b class="text-ios-pink">${formatMoney(giveawayVal)}</b></p>
                </div>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `quanlykho_backup_${getTodayString()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.onload = function() {
      loadDB();
      switchTab('products');
    };
  </script>
</body>
</html>
